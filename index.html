<body>
  <div class="container" id="app">
    <div class="loading">⏳ در حال بارگذاری...</div>
  </div>

  <script>
    let appData = { courses: [] };
    let currentCourse = null, currentLesson = null;
    let quizState = { currentQuestion: 0, score: 0, answered: false };
    let demoAccount = { balance: 10000, equity: 10000, positions: [], pendingOrders: [], history: [] };
    let userProfile = { name: 'کاربر آکادمی', email: 'user@academy.com', joinDate: '2026-09-06', lessonsCompleted: 0, quizzesPassed: 0, totalTrades: 0, winRate: 0, theme: 'light', notifications: true };
    let chart, candleSeries, currentPrice = 80027, ws;
    let currentTimeframe = '15m', tradeType = 'buy', sliderValue = 0;
    let activeTab = 'positions', activeIndicators = [];
    let chartData = [], indicatorSeries = {}, positionLines = {};
    let currentPair = 'BTCUSDT';
    let isPremiumUser = false;
    let apiCallCount = 0;
    let lastApiCall = 0;
    
    let pairInfo = {
      BTCUSDT: { name: 'BTC/USDT', price: 80027, change: 0.53, decimals: 2, volatility: 500, basePrice: 80000 },
      ETHUSDT: { name: 'ETH/USDT', price: 3850, change: -1.24, decimals: 2, volatility: 30, basePrice: 3800 },
      XAUUSD:  { name: 'XAU/USD',  price: 2650, change: 0.87, decimals: 2, volatility: 10, basePrice: 2650 },
      EURUSD:  { name: 'EUR/USD',  price: 1.0850, change: 0.12, decimals: 4, volatility: 0.005, basePrice: 1.0850 }
    };

    function cleanJsonKeys(obj) {
      if (Array.isArray(obj)) return obj.map(item => cleanJsonKeys(item));
      else if (obj !== null && typeof obj === 'object') {
        const cleaned = {};
        for (let key in obj) { const cleanKey = key.trim(); cleaned[cleanKey] = cleanJsonKeys(obj[key]); }
        return cleaned;
      }
      return obj;
    }

    function getCleanImageUrl(url) { if (!url) return null; return String(url).replace(/\s+/g, ''); }

    function getLessonIcon(title) {
      const t = String(title).toLowerCase();
      if (t.includes('کندل') || t.includes('الگو')) return '🕯️';
      if (t.includes('بلاکچین') || t.includes('کریپتو')) return '🔗';
      if (t.includes('کیف پول')) return '👛';
      if (t.includes('بازار')) return '📊';
      if (t.includes('فارکس') || t.includes('ارز')) return '💱';
      if (t.includes('حمایت') || t.includes('مقاومت')) return '📈';
      if (t.includes('روند')) return '📉';
      if (t.includes('پرایس اکشن')) return '';
      if (t.includes('لوریج') || t.includes('مارجین')) return '⚖️';
      if (t.includes('ریسک')) return '🛡️';
      if (t.includes('آزمون')) return '📝';
      if (t.includes('اسمارت') || t.includes('smart')) return '';
      if (t.includes('ict')) return '🎯';
      if (t.includes('استراتژی')) return '⚙️';
      if (t.includes('روانشناسی')) return '🧘';
      return '📚';
    }

    async function initApp() {
      try {
        const files = ['data-part1.json', 'data-part2.json', 'data-part3.json', 'data-part4.json', 'data-part5.json'];
        const responses = await Promise.all(files.map(f => fetch(f).then(r => r.text()).catch(() => null)));
        appData.courses = [];
        responses.forEach((text, index) => {
          if (!text) return;
          try {
            const data = JSON.parse(text);
            const cleaned = cleanJsonKeys(data);
            if (cleaned.courses && Array.isArray(cleaned.courses)) {
              cleaned.courses.forEach(course => {
                const normalizedCourse = {
                  id: String(course.id || '').replace(/\s+/g, ''),
                  level: String(course.level || '').trim(),
                  title: String(course.title || '').trim(),
                  lessons: Array.isArray(course.lessons) ? course.lessons.map(l => ({
                    id: String(l.id || '').replace(/\s+/g, ''),
                    title: String(l.title || '').trim(),
                    image: String(l.image || '').replace(/\s+/g, ''),
                    content: l.content || '',
                    quiz: Array.isArray(l.quiz) ? l.quiz : []
                  })) : []
                };
                appData.courses.push(normalizedCourse);
              });
            }
          } catch (e) { console.error('خطا در خواندن فایل JSON شماره', index + 1, e); }
        });
        if (appData.courses.length === 0) {
          document.getElementById('app').innerHTML = '<div class="loading">❌ خطا در بارگذاری دوره‌ها</div>';
          return;
        }
        loadDemoAccount();
        loadUserProfile();
        if (!location.hash) history.replaceState({ view: 'home' }, '', '#home');
        handleRoute();
      } catch (error) {
        console.error('Error:', error);
        document.getElementById('app').innerHTML = '<div class="loading">❌ خطای سیستم</div>';
      }
    }

    function handleRoute() {
      const hash = location.hash;
      if (hash === '#home' || hash === '' || !hash) renderHome();
      else if (hash.startsWith('#level-')) renderLevelCourses(hash.replace('#level-', ''));
      else if (hash.startsWith('#course-')) renderCourseLessons(hash.replace('#course-', ''));
      else if (hash.startsWith('#lesson-')) {
        const parts = hash.replace('#lesson-', '').split('-');
        renderLesson(parts[0], parseInt(parts[1]));
      }
      else if (hash === '#quiz') renderQuizQuestion();
      else if (hash === '#demo') renderTradePage();
      else if (hash === '#profile') renderProfile();
      else renderHome();
    }

    function renderHome() {
      const levels = [
        { id: 'beginner', icon: '🌱', title: 'دوره مقدماتی', levelName: 'مقدماتی', count: appData.courses.filter(c => c.level.includes('مقدماتی')).length },
        { id: 'intermediate', icon: '🌿', title: 'دوره میانی', levelName: 'میانی', count: appData.courses.filter(c => c.level.includes('میانی')).length },
        { id: 'advanced', icon: '🌳', title: 'دوره پیشرفته', levelName: 'پیشرفته', count: appData.courses.filter(c => c.level.includes('پیشرفته')).length }
      ];
      let html = `<div class="header"><h1>📚 آکادمی ترید</h1><p>مسیر شما تا حرفه‌ای شدن در تحلیل بازار</p></div>

    function renderLevelCourses(levelId) {
      let levelName = levelId === 'beginner' ? 'مقدماتی' : levelId === 'intermediate' ? 'میانی' : levelId === 'advanced' ? 'پیشرفته' : decodeURIComponent(levelId);
      const courses = appData.courses.filter(c => c.level.includes(levelName));
      if (courses.length === 0) {
        document.getElementById('app').innerHTML = `<div class="loading">️ هیچ دوره‌ای در سطح "${levelName}" یافت نشد</div><button class="back-button" onclick="navigateTo('#home')">↶ بازگشت</button>`;
        return;
      }
      let html = `<div class="header"><h1>${levelName}</h1><p>${courses.length} دوره در این سطح</p></div>`;
      courses.forEach((c, i) => {
        html += `<div class="course-card" onclick="navigateTo('#course-${c.id}')"><div class="course-title">${i + 1}. ${c.title}</div><div class="course-info">${c.lessons.length} درس</div></div>`;
      });
      html += `<button class="back-button" onclick="navigateTo('#home')">↶ بازگشت</button>`;
      document.getElementById('app').innerHTML = html;
    }

    function renderCourseLessons(courseId) {
      const cleanCourseId = String(courseId).replace(/\s+/g, '');
      const currentCourse = appData.courses.find(c => c.id === cleanCourseId);
      if (!currentCourse) {
        document.getElementById('app').innerHTML = `<div class="loading">❌ دوره پیدا نشد</div><button class="back-button" onclick="navigateTo('#home')">↶ بازگشت</button>`;
        return;
      }
      const lessons = currentCourse.lessons || [];
      let html = `<div class="header"><h1>${currentCourse.title}</h1><p>${lessons.length} درس</p></div>`;
      if (lessons.length === 0) html += `<div class="loading">⚠️ این دوره هنوز درسی ندارد</div>`;
      else lessons.forEach((l, i) => {
        html += `<div class="lesson-item" onclick="navigateTo('#lesson-${currentCourse.id}-${i}')"><div class="lesson-number">${i + 1}</div><div class="lesson-title">${l.title}</div></div>`;
      });
      html += `<button class="back-button" onclick="navigateTo('#home')">↶ بازگشت</button>`;
      document.getElementById('app').innerHTML = html;
    }

    function renderLesson(courseId, lessonIndex) {
      const cleanCourseId = String(courseId).replace(/\s+/g, '');
      const course = appData.courses.find(c => c.id === cleanCourseId);
      if (!course) return navigateTo('#home');
      const lessons = course.lessons || [];
      if (lessonIndex < 0 || lessonIndex >= lessons.length) return navigateTo(`#course-${cleanCourseId}`);
      const currentLesson = lessons[lessonIndex];
      if (!currentLesson) return navigateTo(`#course-${cleanCourseId}`);
      const lessonIcon = getLessonIcon(currentLesson.title);
      const cleanUrl = getCleanImageUrl(currentLesson.image);
      const hasImage = cleanUrl && !cleanUrl.includes('PENDING');
      let imageHtml = '';
      if (hasImage) {
        imageHtml = `<img src="${cleanUrl}" alt="${currentLesson.title}" style="width:100%;height:180px;object-fit:cover;border-radius:10px;margin-bottom:16px;display:block;" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div style="width:100%;height:180px;background:linear-gradient(135deg,#E8F5E9 0%,#C8E6C9 100%);border-radius:10px;margin-bottom:16px;display:none;align-items:center;justify-content:center;font-size:64px;color:#1D9E75">${lessonIcon}</div>`;
      } else {
        imageHtml = `<div style="width:100%;height:180px;background:linear-gradient(135deg,#E8F5E9 0%,#C8E6C9 100%);border-radius:10px;margin-bottom:16px;display:flex;align-items:center;justify-content:center;font-size:64px;color:#1D9E75">${lessonIcon}</div>`;
      }
      const hasQuiz = currentLesson.quiz && currentLesson.quiz.length > 0;
      let html = `<div class="lesson-content">${imageHtml}<h2 style="color: #1D9E75; margin-bottom: 16px; font-size: 18px;">${currentLesson.title}</h2><div>${currentLesson.content}</div>${hasQuiz ? `<button class="quiz-button" onclick="startQuiz(${course.lessons.indexOf(currentLesson)})">🎯 شروع آزمون این درس (${currentLesson.quiz.length} سوال)</button>` : ''}</div>`;
      html += `<button class="back-button ${hasQuiz ? 'hidden' : ''}" onclick="navigateTo('#course-${cleanCourseId}')">↶ بازگشت</button>`;
      document.getElementById('app').innerHTML = html;
      window.scrollTo(0, 0);
    }

    function startQuiz(lessonIndex) {
      const hash = location.hash;
      const parts = hash.replace('#lesson-', '').split('-');
      const courseId = parts[0];
      const course = appData.courses.find(c => c.id === courseId);
      if (!course || !course.lessons[lessonIndex]) return;
      currentCourse = course;
      currentLesson = course.lessons[lessonIndex];
      quizState = { currentQuestion: 0, score: 0, answered: false };
      navigateTo('#quiz');
    }

    function setupResize() {
      const handle = document.getElementById('resizeHandle');
      const chartMain = document.getElementById('chartMain');
      if (!handle || !chartMain) return;
      let isResizing = false, startY, startHeight;
      const startResize = (e) => {
        isResizing = true;
        startY = e.touches ? e.touches[0].clientY : e.clientY;
        startHeight = chartMain.clientHeight;
        e.preventDefault();
        e.stopPropagation();
      };
      const doResize = (e) => {
        if (!isResizing) return;
        e.preventDefault();
        e.stopPropagation();
        const y = e.touches ? e.touches[0].clientY : e.clientY;
        const delta = startY - y;
        const newHeight = Math.max(200, Math.min(window.innerHeight * 0.8, startHeight + delta));
        chartMain.style.height = newHeight + 'px';
        if (chart) { try { chart.applyOptions({ width: chartMain.clientWidth, height: newHeight - 10 }); } catch(err) {} }
      };
      const stopResize = () => { isResizing = false; };
      handle.addEventListener('mousedown', startResize);
      handle.addEventListener('touchstart', startResize, {passive: false});
      document.addEventListener('mousemove', doResize);
      document.addEventListener('touchmove', doResize, {passive: false});
      document.addEventListener('mouseup', stopResize);
      document.addEventListener('touchend', stopResize);
    }

    async function fetchWithTimeout(url, timeout = 6000) {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeout);
      try {
        const response = await fetch(url, { signal: controller.signal });
        clearTimeout(id);
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return await response.json();
      } catch (e) {
        clearTimeout(id);
        throw e;
      }
    }

    async function fetchChartData() {
      const now = Date.now();
      if (now - lastApiCall < 10000 && apiCallCount > 5) {
        console.log('Rate limited');
        return null;
      }
      
      const apis = [
        { url: `https://api.binance.com/api/v3/klines?symbol=${currentPair}&interval=${currentTimeframe}&limit=200`, format: 'binance' },
        { url: `https://api.binance.us/api/v3/klines?symbol=${currentPair}&interval=${currentTimeframe}&limit=200`, format: 'binance' },
        { url: `https://data-api.binance.vision/api/v3/klines?symbol=${currentPair}&interval=${currentTimeframe}&limit=200`, format: 'binance' }
      ];
      
      for (const api of apis) {
        try {
          const data = await fetchWithTimeout(api.url, 5000);
          lastApiCall = Date.now();
          apiCallCount++;
          return data.map(k => ({
            time: k[0] / 1000,
            open: parseFloat(k[1]),
            high: parseFloat(k[2]),
            low: parseFloat(k[3]),
            close: parseFloat(k[4]),
          }));
        } catch (e) {
          console.log('API failed:', api.url, e.message);
          continue;
        }
      }
      return null;
    }

    function generateSimulatedData() {
      const info = pairInfo[currentPair];
      chartData = [];
      let price = info.basePrice;
      const now = Math.floor(Date.now() / 1000);
      const intervalSeconds = currentTimeframe === '1m' ? 60 : currentTimeframe === '5m' ? 300 : currentTimeframe === '15m' ? 900 : currentTimeframe === '1h' ? 3600 : 14400;
      
      for (let i = 199; i >= 0; i--) {
        const time = now - i * intervalSeconds;
        const change = (Math.random() - 0.5) * info.volatility * 0.3;
        const open = price;
        const close = price + change;
        const bodySize = Math.abs(close - open);
        const shadowMultiplier = 0.1 + Math.random() * 0.4;
        const high = Math.max(open, close) + bodySize * shadowMultiplier;
        const low = Math.min(open, close) - bodySize * shadowMultiplier;
        chartData.push({ time, open, high, low, close });
        price = close;
      }
      
      currentPrice = chartData[chartData.length - 1].close;
      pairInfo[currentPair].price = currentPrice;
      if (candleSeries) candleSeries.setData(chartData);
      updatePriceDisplay();
      drawPositionLines();
      drawIndicators();
    }

      if (typeof LightweightCharts === 'undefined') {
        container.innerHTML = '<div class="empty-state">خطا در بارگذاری چارت</div>';
        return;
      }
      try {
        chart = LightweightCharts.createChart(container, {
          width: container.clientWidth,
          height: container.clientHeight - 10,
          layout: { background: { color: '#FFFFFF' }, textColor: '#1A1A1A', fontSize: 10 },
          grid: { vertLines: { color: '#F0F0F0' }, horzLines: { color: '#F0F0F0' } },
          crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
          rightPriceScale: { 
            borderColor: '#E8E8E8', 
            scaleMargins: { top: 0.02, bottom: 0.02 },
            entireTextOnly: false
          },
          timeScale: { 
            borderColor: '#E8E8E8', 
            timeVisible: true, 
            rightOffset: 5,
            tickMarkFormatter: (time) => {
              const date = new Date(time * 1000);
              const hours = date.getHours().toString().padStart(2, '0');
              const minutes = date.getMinutes().toString().padStart(2, '0');
              return `${hours}:${minutes}`;
            }
          },
          handleScroll: { vertTouchDrag: false, horzTouchDrag: true, mouseWheel: true },
          handleScale: { 
            axisPressedMouseMove: { price: true, time: true }, 
            mouseWheel: true, 
            pinch: true 
          }
        });
        candleSeries = chart.addCandlestickSeries({
          upColor: '#0ECB81', downColor: '#F64653',
          borderVisible: false, wickUpColor: '#0ECB81', wickDownColor: '#F64653',
        });
        
        const isCrypto = currentPair === 'BTCUSDT' || currentPair === 'ETHUSDT';
        
        if (isPremiumUser && isCrypto) {
          const loadingDiv = document.createElement('div');
          loadingDiv.className = 'chart-loading';
          loadingDiv.id = 'chartLoading';
          loadingDiv.textContent = '⏳ در حال دریافت داده...';
          container.appendChild(loadingDiv);
          
          fetchChartData().then(data => {
            const ld = document.getElementById('chartLoading');
            if (ld) ld.remove();
            
            if (data && data.length > 0) {
              chartData = data;
              candleSeries.setData(chartData);
              currentPrice = chartData[chartData.length - 1].close;
              pairInfo[currentPair].price = currentPrice;
              updatePriceDisplay();
              drawPositionLines();
              drawIndicators();
              
              if (ws) { if (typeof ws === 'object' && ws.close) ws.close(); else clearInterval(ws); }
              ws = new WebSocket(`wss://stream.binance.com:9443/ws/${currentPair.toLowerCase()}@kline_${currentTimeframe}`);
              ws.onmessage = (event) => {
                try {
                  const data = JSON.parse(event.data);
                  const k = data.k;
                  const candle = { time: k.t / 1000, open: parseFloat(k.o), high: parseFloat(k.h), low: parseFloat(k.l), close: parseFloat(k.c) };
                  if (candleSeries) candleSeries.update(candle);
                  currentPrice = candle.close;
                  pairInfo[currentPair].price = currentPrice;
                  updatePriceDisplay();
                  updatePositionsPnL();
                } catch(e) {}
              };
              ws.onerror = () => {};
            } else {
              generateSimulatedData();
            }
          }).catch(err => {
            const ld = document.getElementById('chartLoading');
            if (ld) ld.remove();
            console.error('API error:', err);
            generateSimulatedData();
          });
        } else {
          generateSimulatedData();
          if (ws) { clearInterval(ws); }
          ws = setInterval(() => {
            const info = pairInfo[currentPair];
            const change = (Math.random() - 0.5) * info.volatility * 0.05;
            currentPrice += change;
            pairInfo[currentPair].price = currentPrice;
            if (chartData.length > 0) {
              const lastCandle = chartData[chartData.length - 1];
              lastCandle.close = currentPrice;
              if (currentPrice > lastCandle.high) lastCandle.high = currentPrice + Math.abs(change) * 0.3;
              if (currentPrice < lastCandle.low) lastCandle.low = currentPrice - Math.abs(change) * 0.3;
              if (candleSeries) candleSeries.update(lastCandle);
            }
            updatePriceDisplay();
            updatePositionsPnL();
          }, 2000);
        }
      } catch (err) {
        console.error('Chart error:', err);
        container.innerHTML = '<div class="empty-state">📊 خطا در بارگذاری چارت</div>';
      }
    }

    function calculateMA(data, period) {
      const result = [];
      for (let i = period - 1; i < data.length; i++) {
        let sum = 0;
        for (let j = 0; j < period; j++) sum += data[i - j].close;
        result.push({ time: data[i].time, value: sum / period });
      }
      return result;
    }

    function calculateEMA(data, period) {
      const result = [];
      const multiplier = 2 / (period + 1);
      let ema = data[0].close;
      for (let i = 0; i < data.length; i++) {
        if (i < period - 1) ema = (data[i].close + (period - 1) * ema) / period;
        else ema = (data[i].close - ema) * multiplier + ema;
        if (i >= period - 1) result.push({ time: data[i].time, value: ema });
      }
      return result;
    }

    function calculateBollinger(data, period, stdDev) {
      const upper = [], middle = [], lower = [];
      for (let i = period - 1; i < data.length; i++) {
        let sum = 0;
        for (let j = 0; j < period; j++) sum += data[i - j].close;
        const avg = sum / period;
        let variance = 0;
        for (let j = 0; j < period; j++) variance += Math.pow(data[i - j].close - avg, 2);
        const std = Math.sqrt(variance / period);
        upper.push({ time: data[i].time, value: avg + stdDev * std });
        middle.push({ time: data[i].time, value: avg });
        lower.push({ time: data[i].time, value: avg - stdDev * std });
      }
      return { upper, middle, lower };
    }

    function calculateRSI(data, period) {
      const result = [];
      let gains = 0, losses = 0;
      for (let i = 1; i <= period; i++) {
        const change = data[i].close - data[i - 1].close;
        if (change > 0) gains += change; else losses -= change;
      }
      let avgGain = gains / period, avgLoss = losses / period;
      for (let i = period; i < data.length; i++) {
        const change = data[i].close - data[i - 1].close;
        const gain = change > 0 ? change : 0;
        const loss = change < 0 ? -change : 0;
        avgGain = (avgGain * (period - 1) + gain) / period;
        avgLoss = (avgLoss * (period - 1) + loss) / period;
        const rs = avgLoss === 0 ? 100 : avgGain / avgLoss;
        const rsi = 100 - (100 / (1 + rs));
        result.push({ time: data[i].time, value: rsi });
      }
      return result;
    }

    function calculateMACD(data) {
      const ema12 = calculateEMA(data, 12);
      const ema26 = calculateEMA(data, 26);
      const ema12Map = new Map(ema12.map(e => [e.time, e.value]));
      const ema26Map = new Map(ema26.map(e => [e.time, e.value]));
      const macdValues = [];
      data.forEach(d => {
        if (ema12Map.has(d.time) && ema26Map.has(d.time)) {
          macdValues.push({ time: d.time, value: ema12Map.get(d.time) - ema26Map.get(d.time) });
        }
      });
      const signalMultiplier = 2 / 10;
      const signalLine = [];
      let signal = macdValues[0]?.value || 0;
      macdValues.forEach((m, i) => {
        if (i < 9) signal = (m.value + 9 * signal) / 10;
        else signal = (m.value - signal) * signalMultiplier + signal;
        signalLine.push({ time: m.time, value: signal });
      });
      const histogram = macdValues.map((m, i) => ({ time: m.time, value: m.value - (signalLine[i]?.value || 0) }));
      return { macd: macdValues, signal: signalLine, histogram };
    }

    function drawRSI(rsiData, canvas) {
      if (!canvas) return;
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width * 2;
      canvas.height = rect.height * 2;
      canvas.style.width = rect.width + 'px';
      canvas.style.height = rect.height + 'px';
      const ctx = canvas.getContext('2d');
      ctx.scale(2, 2);
      const w = rect.width, h = rect.height;
      ctx.fillStyle = 'white';
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = 'rgba(246, 70, 83, 0.08)';
      ctx.fillRect(0, 0, w, h * 0.3);
      ctx.fillStyle = 'rgba(14, 203, 129, 0.08)';
      ctx.fillRect(0, h * 0.7, w, h * 0.3);
      ctx.strokeStyle = '#E0E0E0';
      ctx.setLineDash([3, 3]);
      ctx.lineWidth = 1;
      [30, 50, 70].forEach(level => {
        const y = h - (level / 100) * h;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
        ctx.fillStyle = '#7F8C8D';
        ctx.font = 'bold 10px Arial';
        ctx.textAlign = 'left';
        ctx.fillText(level.toString(), 6, y - 3);
      });
      ctx.setLineDash([]);
      ctx.strokeStyle = '#FF9800';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      rsiData.forEach((r, i) => {
        const x = (i / (rsiData.length - 1)) * w;
        const y = h - (r.value / 100) * h;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();
    }

    // MACD با مقیاس دوگانه - هیستوگرام بزرگ‌تر و واضح‌تر
    function drawMACD(macdData, canvas) {
      if (!canvas) return;
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width * 2;
      canvas.height = rect.height * 2;
      canvas.style.width = rect.width + 'px';
      canvas.style.height = rect.height + 'px';
      const ctx = canvas.getContext('2d');
      ctx.scale(2, 2);
      const w = rect.width, h = rect.height;
      ctx.fillStyle = 'white';
      ctx.fillRect(0, 0, w, h);
      
      const midY = h / 2;
      
      // مقیاس جداگانه برای خطوط MACD و Signal
      const maxLine = Math.max(
        ...macdData.macd.map(v => Math.abs(v.value)),
        ...macdData.signal.map(v => Math.abs(v.value))
      );
      const lineScale = (midY * 0.85) / (maxLine || 1);
      
      // مقیاس جداگانه برای هیستوگرام (بزرگ‌نمایی 2.5 برابری)
      const maxHist = Math.max(...macdData.histogram.map(v => Math.abs(v.value)));
      const histScale = (midY * 0.85 * 2.5) / (maxHist || 1);
      
      // خط صفر
      ctx.strokeStyle = '#E0E0E0';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, midY);
      ctx.lineTo(w, midY);
      ctx.stroke();
      
      // رسم هیستوگرام با مقیاس مستقل (بزرگ‌تر)
      const barWidth = Math.max(3, (w / macdData.histogram.length) * 0.85);
      macdData.histogram.forEach((h_val, i) => {
        const x = (i / (macdData.histogram.length - 1)) * w;
        const h_px = h_val.value * histScale;
        ctx.globalAlpha = 0.75;
        ctx.fillStyle = h_val.value >= 0 ? '#0ECB81' : '#F64653';
        const barHeight = Math.abs(h_px);
        const y = h_val.value >= 0 ? midY - barHeight : midY;
        ctx.fillRect(x - barWidth/2, y, barWidth, barHeight);
      });
      ctx.globalAlpha = 1.0;
      
      // رسم خط MACD با مقیاس خطوط
      ctx.strokeStyle = '#2196F3';
      ctx.lineWidth = 2;
      ctx.beginPath();
      macdData.macd.forEach((m, i) => {
        const x = (i / (macdData.macd.length - 1)) * w;
        const y = midY - m.value * lineScale;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();
      
      // رسم خط Signal با مقیاس خطوط
      ctx.strokeStyle = '#FF9800';
      ctx.lineWidth = 2;
      ctx.beginPath();
      macdData.signal.forEach((s, i) => {
        const x = (i / (macdData.signal.length - 1)) * w;
        const y = midY - s.value * lineScale;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();
      
      // لیبل مقادیر
      ctx.fillStyle = '#2196F3';
      ctx.font = 'bold 9px Arial';
      ctx.textAlign = 'left';
      ctx.fillText('MACD', 8, 14);
      ctx.fillStyle = '#FF9800';
      ctx.fillText('Signal', 50, 14);
    }

    function generateOrderBook() {
      const asks = [], bids = [];
      const info = pairInfo[currentPair];
      const decimals = info.decimals;
      const step = currentPair === 'BTCUSDT' ? 10 : currentPair === 'ETHUSDT' ? 1 : currentPair === 'XAUUSD' ? 0.5 : 0.0005;
      for (let i = 1; i <= 8; i++) {
        asks.push({
          price: (currentPrice + i * step).toFixed(decimals),
          amount: (Math.random() * 10).toFixed(4)
        });
        bids.push({
          price: (currentPrice - i * step).toFixed(decimals),
          amount: (Math.random() * 10).toFixed(4)
        });
      }
      return { asks: asks.reverse(), bids };
    }

    function renderOrderBook() {
      const { asks, bids } = generateOrderBook();
      const asksHtml = asks.map(o => `<div class="order-row ask"><span class="col-amount">${o.amount}</span><span class="col-price ask">${o.price}</span></div>`).join('');
      const bidsHtml = bids.map(o => `<div class="order-row bid"><span class="col-amount">${o.amount}</span><span class="col-price bid">${o.price}</span></div>`).join('');
      const asksEl = document.getElementById('orderBookAsks');
      const bidsEl = document.getElementById('orderBookBids');
      if (asksEl) asksEl.innerHTML = asksHtml;
      if (bidsEl) bidsEl.innerHTML = bidsHtml;
    }

    function setTradeType(type) {

      const buyTab = document.getElementById('buyTab');

      if (sellTab) sellTab.className = 'trade-tab ' + (type === 'sell' ? 'sell' : '');
      if (submitBtn) {
        submitBtn.className = 'submit-btn ' + type;
        submitBtn.textContent = type === 'buy' ? `Buy/Long ${currentPair.replace('USDT','').replace('USD','')}` : `Sell/Short ${currentPair.replace('USDT','').replace('USD','')}`;
      }
      updateTradeInfo();
    }

    function setLeverage(lev, btn) {
      document.querySelectorAll('.leverage-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      updateTradeInfo();
    }

    function setupSlider() {
      const sliderDot = document.getElementById('sliderDot');
      const sliderFill = document.getElementById('sliderFill');
      const sliderContainer = document.getElementById('sliderContainer');
      if (!sliderDot || !sliderFill || !sliderContainer) return;
      let isDragging = false;
      const startDrag = (e) => { isDragging = true; e.preventDefault(); e.stopPropagation(); };
      const drag = (e) => {
        if (!isDragging) return;
        e.preventDefault();
        e.stopPropagation();
        const rect = sliderContainer.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        let x = ((clientX - rect.left) / rect.width) * 100;
        x = Math.max(0, Math.min(100, x));
        sliderValue = x;
        sliderDot.style.left = x + '%';
        sliderFill.style.width = x + '%';
        const percentEl = document.getElementById('sliderPercent');
        if (percentEl) percentEl.textContent = Math.round(x) + '%';
        updateTradeInfo();
      };
      const endDrag = () => { isDragging = false; };
      sliderDot.addEventListener('mousedown', startDrag);
      sliderDot.addEventListener('touchstart', startDrag, {passive: false});
      document.addEventListener('mousemove', drag);
      document.addEventListener('touchmove', drag, {passive: false});
      document.addEventListener('mouseup', endDrag);
      document.addEventListener('touchend', endDrag);
      sliderContainer.addEventListener('click', (e) => {
        const rect = sliderContainer.getBoundingClientRect();
        let x = ((e.clientX - rect.left) / rect.width) * 100;
        x = Math.max(0, Math.min(100, x));
        sliderValue = x;
        sliderDot.style.left = x + '%';
        sliderFill.style.width = x + '%';
        const percentEl = document.getElementById('sliderPercent');
        if (percentEl) percentEl.textContent = Math.round(x) + '%';
        updateTradeInfo();
      });
    }

    function updateTradeInfo() {
      const amountInput = parseFloat(document.getElementById('tradeAmount')?.value) || 0;
      const leverage = parseInt(document.querySelector('.leverage-btn.active')?.textContent) || 3;
      if (sliderValue > 0 && amountInput === 0) {
        const calculatedAmount = (demoAccount.balance * sliderValue / 100);
        const amountEl = document.getElementById('tradeAmount');
        if (amountEl) amountEl.value = calculatedAmount.toFixed(2);
      }
      const finalAmount = parseFloat(document.getElementById('tradeAmount')?.value) || 0;
      const margin = (finalAmount * sliderValue / 100) / leverage;
      const available = demoAccount.balance - margin;
      const marginEl = document.getElementById('marginValue');
      const availableEl = document.getElementById('availableValue');
      const maxEl = document.getElementById('maxValue');
      const liqEl = document.getElementById('liqPrice');
      if (marginEl) marginEl.textContent = margin.toFixed(2) + ' USDT';
      if (availableEl) availableEl.textContent = available.toFixed(2) + ' USDT';
      if (maxEl) maxEl.textContent = (finalAmount * sliderValue / 100 / currentPrice).toFixed(6) + ' ' + currentPair.replace('USDT','').replace('USD','');
      if (liqEl) liqEl.textContent = tradeType === 'buy' ? (currentPrice * (1 - 1/leverage)).toFixed(pairInfo[currentPair].decimals) : (currentPrice * (1 + 1/leverage)).toFixed(pairInfo[currentPair].decimals);
    }

    function toggleTPSL() {
      const checkbox = document.getElementById('tpSlCheckbox');
      const container = document.getElementById('tpSlInputs');
      if (!container) return;
      if (checkbox?.checked) {
        container.innerHTML = `<div class="form-group" style="margin-top: 10px;"><label class="form-label">Take Profit</label><input type="number" class="form-input" id="tpInput" placeholder="0.00"></div><div class="form-group"><label class="form-label">Stop Loss</label><input type="number" class="form-input" id="slInput" placeholder="0.00"></div>`;
      } else { container.innerHTML = ''; }
    }

    function submitOrder() {
      const amount = parseFloat(document.getElementById('tradeAmount')?.value) || 0;
      if (amount <= 0) { alert('Please enter a valid amount'); return; }
      const leverage = parseInt(document.querySelector('.leverage-btn.active')?.textContent) || 3;
      const tp = parseFloat(document.getElementById('tpInput')?.value) || null;
      const sl = parseFloat(document.getElementById('slInput')?.value) || null;
      const position = {
        id: Date.now(), pair: currentPair, side: tradeType,
        amount: (amount * sliderValue / 100) / currentPrice,
        entryPrice: currentPrice, leverage: leverage, tp: tp, sl: sl,
        pnl: 0, pnlPercent: 0
      };
      demoAccount.positions.push(position);
      userProfile.totalTrades++;
      saveDemoAccount();
      saveUserProfile();
      drawPositionLines();
      renderPositions();
      alert('Order submitted!');
    }

    function switchTab(tab, event) {
      if (event) event.stopPropagation();
      activeTab = tab;
      document.querySelectorAll('.position-tab').forEach(t => t.classList.remove('active'));
      if (event && event.target) event.target.classList.add('active');
      renderPositions();
    }

    function updatePositionsPnL() {
      demoAccount.positions.forEach(pos => {
        const priceChange = pos.side === 'buy' ? (currentPrice - pos.entryPrice) : (pos.entryPrice - currentPrice);
        pos.pnl = priceChange * pos.amount;
        pos.pnlPercent = (priceChange / pos.entryPrice) * pos.leverage * 100;
      });
      demoAccount.equity = demoAccount.balance + demoAccount.positions.reduce((sum, p) => sum + p.pnl, 0);
      saveDemoAccount();
      if (activeTab === 'positions') renderPositions();
    }

    function renderPositions() {
      const container = document.getElementById('positionsContent');
      if (!container) return;
      if (activeTab === 'positions') {
        const positions = demoAccount.positions.filter(p => p.pair === currentPair);
        if (positions.length === 0) { container.innerHTML = '<div class="empty-state">No open positions</div>'; return; }
        container.innerHTML = positions.map(pos => {
          const pnlClass = pos.pnl >= 0 ? 'profit' : 'loss';
          const pnlSign = pos.pnl >= 0 ? '+' : '';
          return `<div class="position-item"><div class="position-header"><span class="position-pair">${pos.pair}</span><span class="position-side ${pos.side}">${pos.side === 'buy' ? 'Long' : 'Short'}</span></div><div class="position-details"><div class="position-detail"><span class="position-detail-label">Amount</span><span class="position-detail-value">${pos.amount.toFixed(6)}</span></div><div class="position-detail"><span class="position-detail-label">Leverage</span><span class="position-detail-value">${pos.leverage}x</span></div><div class="position-detail"><span class="position-detail-label">Entry</span><span class="position-detail-value">${pos.entryPrice.toFixed(pairInfo[pos.pair]?.decimals || 2)}</span></div><div class="position-detail"><span class="position-detail-label">Margin</span><span class="position-detail-value">${(pos.amount * pos.entryPrice / pos.leverage).toFixed(2)} USDT</span></div></div><div class="position-pnl ${pnlClass}">${pnlSign}$${pos.pnl.toFixed(2)} (${pnlSign}${pos.pnlPercent.toFixed(2)}%)</div><button class="close-btn" onclick="closePosition(${pos.id})">Close Position</button></div>`;
        }).join('');
      } else if (activeTab === 'pending') {
        const pendings = demoAccount.pendingOrders.filter(p => p.pair === currentPair);
        if (pendings.length === 0) { container.innerHTML = '<div class="empty-state">No pending orders<br><small>Use Limit Order to create one</small></div>'; }
        else { container.innerHTML = pendings.map(p => `<div class="pending-item"><div class="pending-item-header"><strong>${p.type} ${p.pair}</strong><button class="cancel-btn" onclick="cancelPending(${p.id})">Cancel</button></div><div>Price: ${p.price.toFixed(pairInfo[p.pair]?.decimals || 2)} | Amount: ${p.amount.toFixed(4)}</div></div>`).join(''); }
      } else if (activeTab === 'history') {
        const history = demoAccount.history.filter(h => h.pair === currentPair);
        if (history.length === 0) { container.innerHTML = '<div class="empty-state">No order history</div>'; return; }
        container.innerHTML = history.slice().reverse().map(h => {
          const pnlClass = h.pnl >= 0 ? 'profit' : 'loss';
          const pnlSign = h.pnl >= 0 ? '+' : '';
          return `<div class="position-item"><div class="position-header"><span class="position-pair">${h.pair}</span><span class="position-side ${h.side}">${h.side === 'buy' ? 'Long' : 'Short'}</span></div><div class="position-details"><div class="position-detail"><span class="position-detail-label">Amount</span><span class="position-detail-value">${h.amount.toFixed(6)}</span></div><div class="position-detail"><span class="position-detail-label">Entry</span><span class="position-detail-value">${h.entryPrice.toFixed(pairInfo[h.pair]?.decimals || 2)}</span></div><div class="position-detail"><span class="position-detail-label">Exit</span><span class="position-detail-value">${h.closePrice?.toFixed(pairInfo[h.pair]?.decimals || 2) || '--'}</span></div><div class="position-detail"><span class="position-detail-label">PnL</span><span class="position-detail-value ${pnlClass}">${pnlSign}$${h.pnl.toFixed(2)}</span></div></div></div>`;
        }).join('');
      }
    }

    function closePosition(id) {
      const posIndex = demoAccount.positions.findIndex(p => p.id === id);
      if (posIndex === -1) return;
      const pos = demoAccount.positions[posIndex];
      pos.closePrice = currentPrice;
      pos.pnl = (pos.side === 'buy' ? 1 : -1) * (currentPrice - pos.entryPrice) * pos.amount;
      demoAccount.balance += pos.pnl;
      demoAccount.history.push(pos);
      demoAccount.positions.splice(posIndex, 1);
      if (pos.pnl > 0) userProfile.winRate = Math.round((userProfile.quizzesPassed / Math.max(1, userProfile.totalTrades)) * 100);
      saveDemoAccount();
      saveUserProfile();
      drawPositionLines();
      renderPositions();
    }

    function cancelPending(id) {
      demoAccount.pendingOrders = demoAccount.pendingOrders.filter(p => p.id !== id);
      saveDemoAccount();
      renderPositions();
    }

    function loadDemoAccount() {
      const saved = localStorage.getItem('demoAccount');
      if (saved) { try { demoAccount = JSON.parse(saved); } catch (e) {} }
    }

    function saveDemoAccount() {
      localStorage.setItem('demoAccount', JSON.stringify(demoAccount));
    }

    function renderQuizQuestion() {
      if (!currentLesson || !currentLesson.quiz || currentLesson.quiz.length === 0) return navigateTo('#home');
      const q = currentLesson.quiz[quizState.currentQuestion];
      const total = currentLesson.quiz.length;
      const num = quizState.currentQuestion + 1;
      let html = `<div class="quiz-container"><div style="text-align: center; margin-bottom: 16px; color: #7F8C8D; font-size: 13px;">سوال ${num} از ${total}</div><div class="quiz-question">${q.question}</div><div id="options-container">${q.options.map((opt, i) => `<div class="quiz-option" onclick="selectAnswer(${i})" id="opt-${i}">${opt}</div>`).join('')}</div><div class="quiz-explanation" id="explanation">💡 ${q.explanation}</div><div class="quiz-nav"><button class="btn-next" id="btn-next" onclick="nextQuestion()" disabled>${num === total ? 'مشاهده نتیجه' : 'سوال بعدی ←'}</button></div></div><button class="back-button" onclick="navigateTo('#course-${currentCourse.id}')">↶ خروج از آزمون</button>`;
      document.getElementById('app').innerHTML = html;
      quizState.answered = false;
    }

    function selectAnswer(index) {
      if (quizState.answered) return;
      quizState.answered = true;
      const q = currentLesson.quiz[quizState.currentQuestion];
      if (index === q.correct) quizState.score++;
      document.querySelectorAll('.quiz-option').forEach((el, i) => {
        el.style.pointerEvents = 'none';
        if (i === q.correct) el.classList.add('correct');
        if (i === index && i !== q.correct) el.classList.add('incorrect');
      });
      document.getElementById('explanation').classList.add('show');
      document.getElementById('btn-next').disabled = false;
    }

    function nextQuestion() {
      quizState.currentQuestion++;
      if (quizState.currentQuestion >= currentLesson.quiz.length) showQuizResult();
      else renderQuizQuestion();
    }

    function showQuizResult() {
      const total = currentLesson.quiz.length;
      const score = quizState.score;
      const pct = Math.round((score / total) * 100);
      let msg = pct === 100 ? '🎉 عالی!' : pct >= 70 ? '✅ آفرین!' : pct >= 50 ? '👍 خوب بود' : '📚 دوباره مرور کنید';
      if (pct >= 70) {
        userProfile.quizzesPassed++;
        userProfile.lessonsCompleted++;
        saveUserProfile();
      }
      document.getElementById('app').innerHTML = `<div class="quiz-container"><div class="quiz-result"><div class="quiz-score">${score} از ${total}</div><div class="quiz-message">${msg}</div><button class="quiz-button" onclick="navigateTo('#course-${currentCourse.id}')" style="max-width: 280px;">بازگشت به دوره</button></div></div><button class="back-button" onclick="navigateTo('#course-${currentCourse.id}')">↶ بازگشت</button>`;
    }

    function navigateTo(hash) {
      if (ws) { if (typeof ws === 'object' && ws.close) ws.close(); else clearInterval(ws); ws = null; }
      if (chart) { chart.remove(); chart = null; }
      history.pushState({ hash }, '', hash);
      handleRoute();
    }
    
    window.addEventListener('popstate', () => handleRoute());
    window.addEventListener('resize', () => {
      if (chart && document.getElementById('chartModal')?.classList.contains('active')) {
        const container = document.getElementById('chartContainer');
        const chartMain = document.getElementById('chartMain');
        if (container && chartMain) { try { chart.applyOptions({ width: container.clientWidth, height: chartMain.clientHeight - 10 }); } catch(e) {} }
      }
    });
    
    initApp();
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js?v=99').catch(console.error);
    }
  </script>
</body>
</html>
