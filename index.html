<body>
  <div class="container" id="app">
    <div class="loading">⏳ در حال بارگذاری...</div>
  </div>

  <script>
    let appData = { courses: [] };
    let currentCourse = null, currentLesson = null;
    let quizState = { currentQuestion: 0, score: 0, answered: false };
    let demoAccount = { balance: 10000, equity: 10000, positions: [], pendingOrders: [], history: [] };
    let userProfile = { name: 'کاربر آکادمی', email: 'user@academy.com', joinDate: '2026-09-06', lessonsCompleted: 0, quizzesPassed: 0, totalTrades: 0, winRate: 0, theme: 'light', notifications: true };
    let chart, candleSeries, currentPrice = 0, priceUpdateInterval, pnlInterval;
    let currentTimeframe = '15m', tradeType = 'buy', sliderValue = 0;
    let activeTab = 'positions', activeIndicators = [];
    let chartData = [], indicatorSeries = {}, positionLines = {};
    let currentPair = 'BTCUSDT';
    let isChartVisible = false;
    let isDataReal = false;
    let lastPriceFetch = 0;
    
    let pairInfo = {
      BTCUSDT: { name: 'BTC/USDT', price: 0, change: 0, decimals: 2, basePrice: 80000, cgId: 'bitcoin', ccSym: 'BTC' },
      ETHUSDT: { name: 'ETH/USDT', price: 0, change: 0, decimals: 2, basePrice: 3800, cgId: 'ethereum', ccSym: 'ETH' },
      XAUUSD:  { name: 'XAU/USD',  price: 0, change: 0, decimals: 2, basePrice: 2650, cgId: null, ccSym: null },
      EURUSD:  { name: 'EUR/USD',  price: 0, change: 0, decimals: 4, basePrice: 1.0850, cgId: null, ccSym: null }
    };

    function cleanJsonKeys(obj) {
      if (Array.isArray(obj)) return obj.map(item => cleanJsonKeys(item));
      else if (obj !== null && typeof obj === 'object') {
        const cleaned = {};
        for (let key in obj) { const cleanKey = key.trim(); cleaned[cleanKey] = cleanJsonKeys(obj[key]); }
        return cleaned;
      }
      return obj;
    }

    function getCleanImageUrl(url) { if (!url) return null; return String(url).replace(/\s+/g, ''); }

    function getLessonIcon(title) {
      const t = String(title).toLowerCase();
      if (t.includes('کندل') || t.includes('الگو')) return '🕯️';
      if (t.includes('بلاکچین') || t.includes('کریپتو')) return '';
      if (t.includes('کیف پول')) return '👛';
      if (t.includes('بازار')) return '';
      if (t.includes('فارکس') || t.includes('ارز')) return '💱';
      if (t.includes('حمایت') || t.includes('مقاومت')) return '📈';
      if (t.includes('روند')) return '📉';
      if (t.includes('پرایس اکشن')) return '💹';
      if (t.includes('لوریج') || t.includes('مارجین')) return '⚖️';
      if (t.includes('ریسک')) return '🛡️';
      if (t.includes('آزمون')) return '';
      if (t.includes('اسمارت') || t.includes('smart')) return '🧠';
      if (t.includes('ict')) return '🎯';
      if (t.includes('استراتژی')) return '⚙️';
      if (t.includes('روانشناسی')) return '🧘';
      return '📚';
    }

    async function initApp() {
      try {
        const files = ['data-part1.json', 'data-part2.json', 'data-part3.json', 'data-part4.json', 'data-part5.json'];
        const responses = await Promise.all(files.map(f => fetch(f).then(r => r.text()).catch(() => null)));
        appData.courses = [];
        responses.forEach((text, index) => {
          if (!text) return;
          try {
            const data = JSON.parse(text);
            const cleaned = cleanJsonKeys(data);
            if (cleaned.courses && Array.isArray(cleaned.courses)) {
              cleaned.courses.forEach(course => {
                const normalizedCourse = {
                  id: String(course.id || '').replace(/\s+/g, ''),
                  level: String(course.level || '').trim(),
                  title: String(course.title || '').trim(),
                  lessons: Array.isArray(course.lessons) ? course.lessons.map(l => ({
                    id: String(l.id || '').replace(/\s+/g, ''),
                    title: String(l.title || '').trim(),
                    image: String(l.image || '').replace(/\s+/g, ''),
                    content: l.content || '',
                    quiz: Array.isArray(l.quiz) ? l.quiz : []
                  })) : []
                };
                appData.courses.push(normalizedCourse);
              });
            }
          } catch (e) { console.error('خطا در خواندن فایل JSON شماره', index + 1, e); }
        });
        if (appData.courses.length === 0) {
          document.getElementById('app').innerHTML = '<div class="loading">❌ خطا در بارگذاری دوره‌ها</div>';
          return;
        }
        loadDemoAccount();
        loadUserProfile();
        await fetchRealPrices();
        if (!location.hash) history.replaceState({ view: 'home' }, '', '#home');
        handleRoute();
      } catch (error) {
        console.error('Error:', error);
        document.getElementById('app').innerHTML = '<div class="loading">❌ خطای سیستم</div>';
      }
    }

    async function fetchRealPrices() {
      const now = Date.now();
      if (now - lastPriceFetch < 10000) return;
      
      try {
        const cgRes = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd&include_24hr_change=true', { signal: AbortSignal.timeout(5000) });
        if (cgRes.ok) {
          const cgData = await cgRes.json();
          if (cgData.bitcoin) { pairInfo.BTCUSDT.price = cgData.bitcoin.usd; pairInfo.BTCUSDT.change = cgData.bitcoin.usd_24h_change || 0; }
          if (cgData.ethereum) { pairInfo.ETHUSDT.price = cgData.ethereum.usd; pairInfo.ETHUSDT.change = cgData.ethereum.usd_24h_change || 0; }
          lastPriceFetch = now;
          console.log('✅ CoinGecko prices loaded');
          return;
        }
      } catch(e) { console.log('CoinGecko failed:', e.message); }
      
      try {
        const ccRes = await fetch('https://api.coincap.io/v2/assets?ids=bitcoin,ethereum', { signal: AbortSignal.timeout(5000) });
        if (ccRes.ok) {
          const ccData = await ccRes.json();
          ccData.data.forEach(asset => {
            const price = parseFloat(asset.priceUsd);
            const change24h = parseFloat(asset.changePercent24Hr);
            if (asset.id === 'bitcoin') { pairInfo.BTCUSDT.price = price; pairInfo.BTCUSDT.change = change24h; }
            else if (asset.id === 'ethereum') { pairInfo.ETHUSDT.price = price; pairInfo.ETHUSDT.change = change24h; }
          });
          lastPriceFetch = now;
          console.log('✅ CoinCap prices loaded');
          return;
        }
      } catch(e) { console.log('CoinCap failed:', e.message); }
      
      console.log('⚠️ Using fallback prices');
      if (pairInfo.BTCUSDT.price === 0) pairInfo.BTCUSDT.price = 80000;
      if (pairInfo.ETHUSDT.price === 0) pairInfo.ETHUSDT.price = 3800;
      if (pairInfo.XAUUSD.price === 0) pairInfo.XAUUSD.price = 2650;
      if (pairInfo.EURUSD.price === 0) pairInfo.EURUSD.price = 1.0850;
      lastPriceFetch = now;
    }

    async function fetchRealCandles() {
      const info = pairInfo[currentPair];
      if (!info.ccSym) return null;
      
      const aggregate = currentTimeframe === '1m' ? 1 : currentTimeframe === '5m' ? 5 : currentTimeframe === '15m' ? 15 : currentTimeframe === '1h' ? 60 : 240;
      const limit = 200;
      
      try {
        const res = await fetch(`https://min-api.cryptocompare.com/data/v2/histominute?fsym=${info.ccSym}&tsym=USD&limit=${limit}&aggregate=${aggregate}`, { signal: AbortSignal.timeout(6000) });
        if (res.ok) {
          const data = await res.json();
          if (data.Data && data.Data.Data && data.Data.Data.length > 0) {
            return data.Data.Data.map(d => ({ time: d.time, open: d.open, high: d.high, low: d.low, close: d.close }));
          }
        }
      } catch(e) { console.log('CryptoCompare candles failed:', e.message); }
      
      return null;
    }

    function generateSimulatedCandles() {
      const info = pairInfo[currentPair];
      const candles = [];
      let price = info.basePrice;
      const now = Math.floor(Date.now() / 1000);
      const intervalSeconds = currentTimeframe === '1m' ? 60 : currentTimeframe === '5m' ? 300 : currentTimeframe === '15m' ? 900 : currentTimeframe === '1h' ? 3600 : 14400;
      const volatility = info.basePrice * 0.002;
      
      for (let i = 199; i >= 0; i--) {
        const time = now - i * intervalSeconds;
        const change = (Math.random() - 0.5) * volatility;
        const open = price;
        const close = price + change;
        const bodySize = Math.abs(close - open);
        const shadowMultiplier = 0.1 + Math.random() * 0.5;
        const high = Math.max(open, close) + bodySize * shadowMultiplier;
        const low = Math.min(open, close) - bodySize * shadowMultiplier;
        candles.push({ time, open, high, low, close });
        price = close;
      }
      return candles;
    }

    function handleRoute() {
      const hash = location.hash;
      if (hash === '#home' || hash === '' || !hash) renderHome();
      else if (hash.startsWith('#level-')) renderLevelCourses(hash.replace('#level-', ''));
      else if (hash.startsWith('#course-')) renderCourseLessons(hash.replace('#course-', ''));
      else if (hash.startsWith('#lesson-')) {
        const parts = hash.replace('#lesson-', '').split('-');
        renderLesson(parts[0], parseInt(parts[1]));
      }
      else if (hash === '#quiz') renderQuizQuestion();
      else if (hash === '#demo') renderTradePage();
      else if (hash === '#profile') renderProfile();
      else renderHome();
    }

    function renderLesson(courseId, lessonIndex) {
      const cleanCourseId = String(courseId).replace(/\s+/g, '');
      const course = appData.courses.find(c => c.id === cleanCourseId);
      if (!course) return navigateTo('#home');
      const lessons = course.lessons || [];
      if (lessonIndex < 0 || lessonIndex >= lessons.length) return navigateTo(`#course-${cleanCourseId}`);
      const currentLesson = lessons[lessonIndex];
      if (!currentLesson) return navigateTo(`#course-${cleanCourseId}`);
      const lessonIcon = getLessonIcon(currentLesson.title);
      const cleanUrl = getCleanImageUrl(currentLesson.image);
      const hasImage = cleanUrl && !cleanUrl.includes('PENDING');
      let imageHtml = '';
      if (hasImage) {
        imageHtml = `<img src="${cleanUrl}" alt="${currentLesson.title}" style="width:100%;height:180px;object-fit:cover;border-radius:10px;margin-bottom:16px;display:block;" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div style="width:100%;height:180px;background:linear-gradient(135deg,#E8F5E9 0%,#C8E6C9 100%);border-radius:10px;margin-bottom:16px;display:none;align-items:center;justify-content:center;font-size:64px;color:#1D9E75">${lessonIcon}</div>`;

      }

    function calculateMA(data, period) { const result = []; for (let i = period - 1; i < data.length; i++) { let sum = 0; for (let j = 0; j < period; j++) sum += data[i - j].close; result.push({ time: data[i].time, value: sum / period }); } return result; }
    function calculateEMA(data, period) { const result = []; const multiplier = 2 / (period + 1); let ema = data[0].close; for (let i = 0; i < data.length; i++) { if (i < period - 1) ema = (data[i].close + (period - 1) * ema) / period; else ema = (data[i].close - ema) * multiplier + ema; if (i >= period - 1) result.push({ time: data[i].time, value: ema }); } return result; }
    function calculateBollinger(data, period, stdDev) { const upper = [], middle = [], lower = []; for (let i = period - 1; i < data.length; i++) { let sum = 0; for (let j = 0; j < period; j++) sum += data[i - j].close; const avg = sum / period; let variance = 0; for (let j = 0; j < period; j++) variance += Math.pow(data[i - j].close - avg, 2); const std = Math.sqrt(variance / period); upper.push({ time: data[i].time, value: avg + stdDev * std }); middle.push({ time: data[i].time, value: avg }); lower.push({ time: data[i].time, value: avg - stdDev * std }); } return { upper, middle, lower }; }
    
    function calculateRSI(data, period) {
      const result = [];
      if (data.length < period + 1) return result;
      let avgGain = 0, avgLoss = 0;
      for (let i = 1; i <= period; i++) { const change = data[i].close - data[i - 1].close; if (change > 0) avgGain += change; else avgLoss += Math.abs(change); }
      avgGain /= period; avgLoss /= period;
      result.push({ time: data[period].time, value: avgLoss === 0 ? 100 : 100 - (100 / (1 + avgGain / avgLoss)) });
      for (let i = period + 1; i < data.length; i++) {
        const change = data[i].close - data[i - 1].close;
        const gain = change > 0 ? change : 0, loss = change < 0 ? Math.abs(change) : 0;
        avgGain = (avgGain * (period - 1) + gain) / period;
        avgLoss = (avgLoss * (period - 1) + loss) / period;
        result.push({ time: data[i].time, value: avgLoss === 0 ? 100 : 100 - (100 / (1 + avgGain / avgLoss)) });
      }
      return result;
    }

    function calculateMACD(data) {
      if (data.length < 35) return { macd: [], signal: [], histogram: [] };
      const ema12 = calculateEMA(data, 12), ema26 = calculateEMA(data, 26);
      const ema26Map = new Map(ema26.map(e => [e.time, e.value]));
      const macdValues = [];
      ema12.forEach(e12 => { if (ema26Map.has(e12.time)) macdValues.push({ time: e12.time, value: e12.value - ema26Map.get(e12.time) }); });
      if (macdValues.length < 9) return { macd: [], signal: [], histogram: [] };
      const signalLine = []; let signal = macdValues[0].value;
      macdValues.forEach((m, i) => { if (i < 8) signal = (m.value + i * signal) / (i + 1); else signal = (m.value - signal) * 0.2 + signal; if (i >= 8) signalLine.push({ time: m.time, value: signal }); });
      const signalMap = new Map(signalLine.map(s => [s.time, s.value]));
      const histogram = macdValues.filter(m => signalMap.has(m.time)).map(m => ({ time: m.time, value: m.value - signalMap.get(m.time) }));
      return { macd: macdValues, signal: signalLine, histogram };
    }

    function drawRSI(rsiData, canvas) {
      if (!canvas || rsiData.length === 0) return;
      const chartContainer = document.getElementById('chartContainer');
      const chartWidth = chartContainer ? chartContainer.clientWidth : canvas.parentElement.clientWidth;
      const chartHeight = canvas.parentElement.clientHeight;
      canvas.width = chartWidth * 2;
      canvas.height = chartHeight * 2;
      canvas.style.width = chartWidth + 'px';
      canvas.style.height = chartHeight + 'px';
      const ctx = canvas.getContext('2d'); ctx.scale(2, 2);
      const w = chartWidth, h = chartHeight;
      ctx.fillStyle = 'white'; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = 'rgba(246, 70, 83, 0.08)'; ctx.fillRect(0, 0, w, h * 0.3);
      ctx.fillStyle = 'rgba(14, 203, 129, 0.08)'; ctx.fillRect(0, h * 0.7, w, h * 0.3);
      ctx.strokeStyle = '#E0E0E0'; ctx.setLineDash([3, 3]); ctx.lineWidth = 1;
      [30, 50, 70].forEach(level => { const y = h - (level / 100) * h; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); ctx.fillStyle = '#7F8C8D'; ctx.font = 'bold 10px Arial'; ctx.textAlign = 'left'; ctx.fillText(level.toString(), 6, y - 3); });
      ctx.setLineDash([]); ctx.strokeStyle = '#FF9800'; ctx.lineWidth = 1.5; ctx.beginPath();
      rsiData.forEach((r, i) => { const x = (i / (rsiData.length - 1)) * w; const y = h - (r.value / 100) * h; if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
      ctx.stroke();
    }

    function drawMACD(macdData, canvas) {
      if (!canvas || macdData.macd.length === 0) return;
      const chartContainer = document.getElementById('chartContainer');
      const chartWidth = chartContainer ? chartContainer.clientWidth : canvas.parentElement.clientWidth;
      const chartHeight = canvas.parentElement.clientHeight;
      canvas.width = chartWidth * 2;
      canvas.height = chartHeight * 2;
      canvas.style.width = chartWidth + 'px';
      canvas.style.height = chartHeight + 'px';
      const ctx = canvas.getContext('2d'); ctx.scale(2, 2);
      const w = chartWidth, h = chartHeight;
      ctx.fillStyle = 'white'; ctx.fillRect(0, 0, w, h);
      const midY = h / 2;
      const maxLine = Math.max(...macdData.macd.map(v => Math.abs(v.value)), ...macdData.signal.map(v => Math.abs(v.value)));
      const lineScale = (midY * 0.85) / (maxLine || 1);
      const maxHist = Math.max(...macdData.histogram.map(v => Math.abs(v.value)));
      const histScale = (midY * 0.85 * 2.5) / (maxHist || 1);
      ctx.strokeStyle = '#E0E0E0'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, midY); ctx.lineTo(w, midY); ctx.stroke();
      const barWidth = Math.max(3, (w / macdData.histogram.length) * 0.85);
      macdData.histogram.forEach((h_val, i) => { const x = (i / (macdData.histogram.length - 1)) * w; const h_px = h_val.value * histScale; ctx.globalAlpha = 0.75; ctx.fillStyle = h_val.value >= 0 ? '#0ECB81' : '#F64653'; const barHeight = Math.abs(h_px); const y = h_val.value >= 0 ? midY - barHeight : midY; ctx.fillRect(x - barWidth/2, y, barWidth, barHeight); });
      ctx.globalAlpha = 1.0;
      ctx.strokeStyle = '#2196F3'; ctx.lineWidth = 2; ctx.beginPath();
      macdData.macd.forEach((m, i) => { const x = (i / (macdData.macd.length - 1)) * w; const y = midY - m.value * lineScale; if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
      ctx.stroke();
      ctx.strokeStyle = '#FF9800'; ctx.lineWidth = 2; ctx.beginPath();
      macdData.signal.forEach((s, i) => { const x = (i / (macdData.signal.length - 1)) * w; const y = midY - s.value * lineScale; if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
      ctx.stroke();
    }

    function generateOrderBook() {
      const asks = [], bids = [];
      const info = pairInfo[currentPair];
      const decimals = info.decimals;
      const step = currentPair === 'BTCUSDT' ? 10 : currentPair === 'ETHUSDT' ? 1 : currentPair === 'XAUUSD' ? 0.5 : 0.0005;
      for (let i = 1; i <= 8; i++) {
        asks.push({ price: (currentPrice + i * step).toFixed(decimals), amount: (Math.random() * 10).toFixed(4) });
        bids.push({ price: (currentPrice - i * step).toFixed(decimals), amount: (Math.random() * 10).toFixed(4) });
      }
      return { asks: asks.reverse(), bids };
    }

    function updatePositionsPnL() {

      demoAccount.positions.forEach(pos => {
        const priceChange = pos.side === 'buy' ? (currentPrice - pos.entryPrice) : (pos.entryPrice - currentPrice);

          const sideClass = pos.side === 'buy' ? 'buy' : 'sell';
          const sideText = pos.side === 'buy' ? 'Long' : 'Short';
          return `<div class="position-item"><div class="position-header"><span class="position-pair">${pos.pair}</span><span class="position-side ${sideClass}">${sideText}</span></div><div class="position-details"><div class="position-detail"><span class="position-detail-label">Amount</span><span class="position-detail-value">${pos.amount.toFixed(6)}</span></div><div class="position-detail"><span class="position-detail-label">Leverage</span><span class="position-detail-value">${pos.leverage}x</span></div><div class="position-detail"><span class="position-detail-label">Entry</span><span class="position-detail-value">${pos.entryPrice.toFixed(pairInfo[pos.pair]?.decimals || 2)}</span></div><div class="position-detail"><span class="position-detail-label">Margin</span><span class="position-detail-value">${(pos.amount * pos.entryPrice / pos.leverage).toFixed(2)} USDT</span></div></div><div class="position-pnl ${pnlClass}">${pnlSign}$${pos.pnl.toFixed(2)} (${pnlSign}${pos.pnlPercent.toFixed(2)}%)</div><button class="close-btn" onclick="closePosition(${pos.id})">Close Position</button></div>`; 
        }).join('');
      } else if (activeTab === 'pending') { container.innerHTML = '<div class="empty-state">No pending orders<br><small>Use Limit Order to create one</small></div>'; }
      else if (activeTab === 'history') { 
        const history = demoAccount.history.filter(h => h.pair === currentPair); 
        if (history.length === 0) { container.innerHTML = '<div class="empty-state">No order history</div>'; return; } 
        container.innerHTML = history.slice().reverse().map(h => { 
          const pnlClass = h.pnl >= 0 ? 'profit' : 'loss'; 
          const pnlSign = h.pnl >= 0 ? '+' : '';
          const sideClass = h.side === 'buy' ? 'buy' : 'sell';
          const sideText = h.side === 'buy' ? 'Long' : 'Short';
          return `<div class="position-item"><div class="position-header"><span class="position-pair">${h.pair}</span><span class="position-side ${sideClass}">${sideText}</span></div><div class="position-details"><div class="position-detail"><span class="position-detail-label">Amount</span><span class="position-detail-value">${h.amount.toFixed(6)}</span></div><div class="position-detail"><span class="position-detail-label">Entry</span><span class="position-detail-value">${h.entryPrice.toFixed(pairInfo[h.pair]?.decimals || 2)}</span></div><div class="position-detail"><span class="position-detail-label">Exit</span><span class="position-detail-value">${h.closePrice?.toFixed(pairInfo[h.pair]?.decimals || 2) || '--'}</span></div><div class="position-detail"><span class="position-detail-label">PnL</span><span class="position-detail-value ${pnlClass}">${pnlSign}$${h.pnl.toFixed(2)}</span></div></div></div>`; 
        }).join(''); 
      }
    }

    function closePosition(id) { const posIndex = demoAccount.positions.findIndex(p => p.id === id); if (posIndex === -1) return; const pos = demoAccount.positions[posIndex]; pos.closePrice = currentPrice; pos.pnl = (pos.side === 'buy' ? 1 : -1) * (currentPrice - pos.entryPrice) * pos.amount; demoAccount.balance += pos.pnl; demoAccount.history.push(pos); demoAccount.positions.splice(posIndex, 1); if (pos.pnl > 0) userProfile.winRate = Math.round((userProfile.quizzesPassed / Math.max(1, userProfile.totalTrades)) * 100); saveDemoAccount(); saveUserProfile(); drawPositionLines(); renderPositions(); updateTradeInfo(); }

    function loadDemoAccount() { const saved = localStorage.getItem('demoAccount'); if (saved) { try { demoAccount = JSON.parse(saved); } catch (e) {} } }
    function saveDemoAccount() { localStorage.setItem('demoAccount', JSON.stringify(demoAccount)); }

    function renderQuizQuestion() { if (!currentLesson || !currentLesson.quiz || currentLesson.quiz.length === 0) return navigateTo('#home'); const q = currentLesson.quiz[quizState.currentQuestion]; const total = currentLesson.quiz.length; const num = quizState.currentQuestion + 1; let html = `<div class="quiz-container"><div style="text-align: center; margin-bottom: 16px; color: #7F8C8D; font-size: 13px;">سوال ${num} از ${total}</div><div class="quiz-question">${q.question}</div><div id="options-container">${q.options.map((opt, i) => `<div class="quiz-option" onclick="selectAnswer(${i})" id="opt-${i}">${opt}</div>`).join('')}</div><div class="quiz-explanation" id="explanation">💡 ${q.explanation}</div><div class="quiz-nav"><button class="btn-next" id="btn-next" onclick="nextQuestion()" disabled>${num === total ? 'مشاهده نتیجه' : 'سوال بعدی ←'}</button></div></div><button class="back-button" onclick="navigateTo('#course-${currentCourse.id}')">↶ خروج از آزمون</button>`; document.getElementById('app').innerHTML = html; quizState.answered = false; }
    function selectAnswer(index) { if (quizState.answered) return; quizState.answered = true; const q = currentLesson.quiz[quizState.currentQuestion]; if (index === q.correct) quizState.score++; document.querySelectorAll('.quiz-option').forEach((el, i) => { el.style.pointerEvents = 'none'; if (i === q.correct) el.classList.add('correct'); if (i === index && i !== q.correct) el.classList.add('incorrect'); }); document.getElementById('explanation').classList.add('show'); document.getElementById('btn-next').disabled = false; }
    function nextQuestion() { quizState.currentQuestion++; if (quizState.currentQuestion >= currentLesson.quiz.length) showQuizResult(); else renderQuizQuestion(); }
    function showQuizResult() { const total = currentLesson.quiz.length; const score = quizState.score; const pct = Math.round((score / total) * 100); let msg = pct === 100 ? ' عالی!' : pct >= 70 ? '✅ آفرین!' : pct >= 50 ? '👍 خوب بود' : '📚 دوباره مرور کنید'; if (pct >= 70) { userProfile.quizzesPassed++; userProfile.lessonsCompleted++; saveUserProfile(); } document.getElementById('app').innerHTML = `<div class="quiz-container"><div class="quiz-result"><div class="quiz-score">${score} از ${total}</div><div class="quiz-message">${msg}</div><button class="quiz-button" onclick="navigateTo('#course-${currentCourse.id}')" style="max-width: 280px;">بازگشت به دوره</button></div></div><button class="back-button" onclick="navigateTo('#course-${currentCourse.id}')">↶ بازگشت</button>`; }

    function navigateTo(hash) { if (chart) { chart.remove(); chart = null; } history.pushState({ hash }, '', hash); handleRoute(); }
    window.addEventListener('popstate', () => handleRoute());
    window.addEventListener('resize', () => { if (chart && isChartVisible) { const container = document.getElementById('chartContainer'); const chartMain = document.getElementById('chartMainInline'); if (container && chartMain) { try { chart.applyOptions({ width: container.clientWidth, height: chartMain.clientHeight - 10 }); } catch(e) {} } } });
    
    initApp();
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('service-worker.js?v=99').catch(console.error); }
  </script>
</body>
</html>
