<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#00D68F">
  <title>آکادمی ترید - دمو تریدینگ</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, Arial, sans-serif; background: #0B1426; color: #EAECEF; line-height: 1.5; width: 100%; overflow-x: hidden; padding-bottom: 80px; }
    .container { max-width: 100%; margin: 0 auto; width: 100%; }
    
    /* Header */
    .trade-header { background: #0B1426; padding: 12px 16px; border-bottom: 1px solid #2B3A50; position: sticky; top: 0; z-index: 100; }
    .pair-selector { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .pair-name { font-size: 20px; font-weight: 700; color: #EAECEF; display: flex; align-items: center; gap: 8px; }
    .pair-change { font-size: 14px; color: #0ECB81; font-weight: 600; }
    .chart-icon { width: 24px; height: 24px; cursor: pointer; opacity: 0.7; }
    
    /* Main Layout */
    .main-layout { display: flex; gap: 12px; padding: 12px; }
    
    /* Order Book - Right Side */
    .order-book-section { flex: 1; max-width: 45%; }
    .price-display { text-align: center; padding: 16px 0; }
    .current-price { font-size: 32px; font-weight: 700; color: #0ECB81; margin-bottom: 4px; }
    .price-change-text { font-size: 14px; color: #848E9C; }
    
    .order-book { background: #1E2329; border-radius: 8px; overflow: hidden; }
    .order-header { display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 8px 12px; background: #2B3A50; font-size: 12px; color: #848E9C; font-weight: 500; }
    .order-row { display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 6px 12px; font-size: 13px; cursor: pointer; position: relative; }
    .order-row.ask { background: rgba(246, 70, 83, 0.1); }
    .order-row.bid { background: rgba(14, 203, 129, 0.1); }
    .order-row .price { font-weight: 600; }
    .order-row .price.ask { color: #F64653; }
    .order-row .price.bid { color: #0ECB81; }
    .order-row .amount { color: #EAECEF; text-align: left; }
    .order-row .total { color: #848E9C; text-align: left; font-size: 12px; }
    
    /* Trading Panel - Left Side */
    .trade-panel-section { flex: 1; max-width: 55%; }
    .trade-panel { background: #1E2329; border-radius: 8px; padding: 16px; }
    
    .trade-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .trade-tab { flex: 1; padding: 12px; border: none; border-radius: 4px; font-size: 14px; font-weight: 600; cursor: pointer; background: #2B3A50; color: #848E9C; }
    .trade-tab.buy { background: #0ECB81; color: white; }
    .trade-tab.sell { background: #F64653; color: white; }
    
    .form-group { margin-bottom: 16px; }
    .form-label { font-size: 13px; color: #848E9C; margin-bottom: 8px; display: block; }
    .form-input { width: 100%; padding: 12px; background: #2B3A50; border: 1px solid #474D57; border-radius: 4px; color: #EAECEF; font-size: 14px; }
    .form-input:focus { outline: none; border-color: #F0B90B; }
    
    .leverage-selector { display: flex; gap: 8px; margin-bottom: 16px; }
    .leverage-btn { padding: 8px 16px; background: #2B3A50; border: 1px solid #474D57; border-radius: 4px; color: #EAECEF; font-size: 13px; cursor: pointer; }
    .leverage-btn.active { background: #F0B90B; color: #0B1426; border-color: #F0B90B; font-weight: 600; }
    
    .amount-slider { margin-bottom: 20px; }
    .slider-container { position: relative; height: 40px; display: flex; align-items: center; }
    .slider-track { position: absolute; width: 100%; height: 4px; background: #2B3A50; border-radius: 2px; }
    .slider-fill { position: absolute; height: 100%; background: #F0B90B; border-radius: 2px; width: 0%; }
    .slider-dot { position: absolute; width: 20px; height: 20px; background: #F0B90B; border-radius: 50%; cursor: grab; left: 0%; transform: translateX(-50%); box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
    .slider-dot:active { cursor: grabbing; }
    .slider-markers { display: flex; justify-content: space-between; margin-top: 8px; }
    .slider-marker { width: 8px; height: 8px; background: #474D57; border-radius: 50%; }
    
    .trade-info-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 13px; }
    .trade-info-label { color: #848E9C; }
    .trade-info-value { color: #EAECEF; font-weight: 500; }
    
    .tp-sl-checkbox { display: flex; align-items: center; gap: 8px; margin: 16px 0; cursor: pointer; }
    .tp-sl-checkbox input[type="checkbox"] { width: 18px; height: 18px; accent-color: #F0B90B; }
    .tp-sl-checkbox label { font-size: 14px; color: #EAECEF; cursor: pointer; }
    
    .submit-btn { width: 100%; padding: 16px; border: none; border-radius: 4px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px; }
    .submit-btn.buy { background: #0ECB81; color: #0B1426; }
    .submit-btn.sell { background: #F64653; color: white; }
    
    /* Positions Tabs */
    .positions-section { padding: 0 12px; }
    .positions-tabs { display: flex; gap: 24px; border-bottom: 1px solid #2B3A50; margin-bottom: 16px; }
    .position-tab { padding: 12px 0; font-size: 14px; color: #848E9C; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .position-tab.active { color: #F0B90B; border-bottom-color: #F0B90B; font-weight: 600; }
    
    .position-item { background: #1E2329; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
    .position-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .position-pair { font-size: 16px; font-weight: 700; color: #EAECEF; }
    .position-side { font-size: 13px; padding: 4px 8px; border-radius: 4px; font-weight: 600; }
    .position-side.long { background: rgba(14, 203, 129, 0.2); color: #0ECB81; }
    .position-side.short { background: rgba(246, 70, 83, 0.2); color: #F64653; }
    .position-details { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 13px; margin-bottom: 12px; }
    .position-detail { display: flex; justify-content: space-between; }
    .position-detail-label { color: #848E9C; }
    .position-detail-value { color: #EAECEF; }
    .position-pnl { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
    .position-pnl.profit { color: #0ECB81; }
    .position-pnl.loss { color: #F64653; }
    .close-btn { width: 100%; padding: 12px; background: #F64653; color: white; border: none; border-radius: 4px; font-size: 14px; font-weight: 600; cursor: pointer; }
    
    /* Chart Modal */
    .chart-modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #0B1426; z-index: 1000; }
    .chart-modal.active { display: block; }
    .chart-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #2B3A50; }
    .chart-back { font-size: 24px; cursor: pointer; color: #EAECEF; }
    .chart-container { height: calc(100vh - 60px); }
    
    /* Responsive */
    @media (max-width: 768px) {
      .main-layout { flex-direction: column; }
      .order-book-section, .trade-panel-section { max-width: 100%; }
      .current-price { font-size: 28px; }
    }
    
    .back-button { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 200px; background: #6366F1; color: white; border: none; padding: 12px 20px; border-radius: 50px; cursor: pointer; font-size: 15px; font-weight: 600; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4); display: flex; align-items: center; justify-content: center; gap: 8px; z-index: 1000; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="trade-header">
      <div class="pair-selector">
        <div class="pair-name">
          BTCUSDT
          <span class="pair-change">+0.53%</span>
        </div>
        <svg class="chart-icon" onclick="toggleChart()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="9" y1="9" x2="15" y2="9"></line>
          <line x1="9" y1="15" x2="15" y2="15"></line>
          <line x1="9" y1="12" x2="15" y2="12"></line>
        </svg>
      </div>
    </div>

    <!-- Main Layout -->
    <div class="main-layout">
      <!-- Order Book (Right) -->
      <div class="order-book-section">
        <div class="price-display">
          <div class="current-price" id="currentPrice">80,027.00</div>
          <div class="price-change-text">≈ $80,027.00 USD</div>
        </div>
        <div class="order-book">
          <div class="order-header">
            <span>Amount(BTC)</span>
            <span>Price(USDT)</span>
            <span>Price(USDT)</span>
          </div>
          <div id="orderBookAsks"></div>
          <div id="orderBookBids"></div>
        </div>
      </div>

      <!-- Trading Panel (Left) -->
      <div class="trade-panel-section">
        <div class="trade-panel">
          <div class="trade-tabs">
            <button class="trade-tab buy" onclick="setTradeType('buy')">Buy/Long</button>
            <button class="trade-tab sell" onclick="setTradeType('sell')">Sell/Short</button>
          </div>

          <div class="leverage-selector">
            <button class="leverage-btn active">1x</button>
            <button class="leverage-btn">3x</button>
            <button class="leverage-btn">5x</button>
            <button class="leverage-btn">10x</button>
            <button class="leverage-btn">20x</button>
          </div>

          <div class="form-group">
            <label class="form-label">Amount (USDT)</label>
            <input type="number" class="form-input" id="tradeAmount" placeholder="0.00" step="0.01">
          </div>

          <div class="amount-slider">
            <div class="slider-container">
              <div class="slider-track"></div>
              <div class="slider-fill" id="sliderFill"></div>
              <div class="slider-dot" id="sliderDot"></div>
            </div>
            <div class="slider-markers">
              <div class="slider-marker"></div>
              <div class="slider-marker"></div>
              <div class="slider-marker"></div>
              <div class="slider-marker"></div>
              <div class="slider-marker"></div>
            </div>
          </div>

          <div class="trade-info-row">
            <span class="trade-info-label">Margin</span>
            <span class="trade-info-value" id="marginValue">0 USDT</span>
          </div>
          <div class="trade-info-row">
            <span class="trade-info-label">Avbl</span>
            <span class="trade-info-value" id="availableValue">-- USDT</span>
          </div>
          <div class="trade-info-row">
            <span class="trade-info-label">Max</span>
            <span class="trade-info-value" id="maxValue">--</span>
          </div>
          <div class="trade-info-row">
            <span class="trade-info-label">Est. Liq. Price</span>
            <span class="trade-info-value" id="liqPrice">-- USDT</span>
          </div>

          <label class="tp-sl-checkbox">
            <input type="checkbox" id="tpSlCheckbox" onchange="toggleTPSL()">
            <label for="tpSlCheckbox">TP/SL</label>
          </label>

          <button class="submit-btn buy" id="submitBtn" onclick="submitOrder()">Buy/Long BTC</button>
        </div>
      </div>
    </div>

    <!-- Positions Section -->
    <div class="positions-section">
      <div class="positions-tabs">
        <div class="position-tab active">Current Position</div>
        <div class="position-tab">Pending Order</div>
        <div class="position-tab">Order History</div>
      </div>
      <div id="positionsList"></div>
    </div>

    <!-- Chart Modal -->
    <div class="chart-modal" id="chartModal">
      <div class="chart-header">
        <span class="chart-back" onclick="toggleChart()">←</span>
        <span>BTC/USDT Chart</span>
        <span></span>
      </div>
      <div class="chart-container" id="chartContainer"></div>
    </div>
  </div>

  <button class="back-button" onclick="navigateTo('#home')">
    <span>↶</span>
    <span>بازگشت</span>
  </button>

  <script>
    let currentPrice = 80027;
    let tradeType = 'buy';
    let sliderValue = 0;
    let chart, candleSeries;
    let positions = [];

    // Generate Order Book Data
    function generateOrderBook() {
      const asks = [];
      const bids = [];
      for (let i = 1; i <= 8; i++) {
        asks.push({
          price: (currentPrice + i * 10).toFixed(2),
          amount: (Math.random() * 10).toFixed(4),
          total: (Math.random() * 100).toFixed(2)
        });
        bids.push({
          price: (currentPrice - i * 10).toFixed(2),
          amount: (Math.random() * 10).toFixed(4),
          total: (Math.random() * 100).toFixed(2)
        });
      }
      return { asks: asks.reverse(), bids };
    }

    function renderOrderBook() {
      const { asks, bids } = generateOrderBook();
      const asksHtml = asks.map(o => `
        <div class="order-row ask">
          <span class="amount">${o.amount}</span>
          <span class="price ask">${o.price}</span>
          <span class="total">${o.total}</span>
        </div>
      `).join('');
      const bidsHtml = bids.map(o => `
        <div class="order-row bid">
          <span class="amount">${o.amount}</span>
          <span class="price bid">${o.price}</span>
          <span class="total">${o.total}</span>
        </div>
      `).join('');
      document.getElementById('orderBookAsks').innerHTML = asksHtml;
      document.getElementById('orderBookBids').innerHTML = bidsHtml;
    }

    // Slider functionality
    const sliderDot = document.getElementById('sliderDot');
    const sliderFill = document.getElementById('sliderFill');
    const sliderContainer = document.querySelector('.slider-container');
    let isDragging = false;

    sliderDot.addEventListener('mousedown', startDrag);
    sliderDot.addEventListener('touchstart', startDrag, {passive: true});
    document.addEventListener('mousemove', drag);
    document.addEventListener('touchmove', drag, {passive: true});
    document.addEventListener('mouseup', endDrag);
    document.addEventListener('touchend', endDrag);

    function startDrag(e) {
      isDragging = true;
      e.preventDefault();
    }

    function drag(e) {
      if (!isDragging) return;
      const rect = sliderContainer.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      let x = ((clientX - rect.left) / rect.width) * 100;
      x = Math.max(0, Math.min(100, x));
      sliderValue = x;
      sliderDot.style.left = x + '%';
      sliderFill.style.width = x + '%';
      updateTradeInfo();
    }

    function endDrag() {
      isDragging = false;
    }

    function setTradeType(type) {
      tradeType = type;
      const tabs = document.querySelectorAll('.trade-tab');
      tabs.forEach(tab => {
        tab.classList.remove('buy', 'sell');
      });
      if (type === 'buy') {
        tabs[0].classList.add('buy');
        document.getElementById('submitBtn').className = 'submit-btn buy';
        document.getElementById('submitBtn').textContent = 'Buy/Long BTC';
      } else {
        tabs[1].classList.add('sell');
        document.getElementById('submitBtn').className = 'submit-btn sell';
        document.getElementById('submitBtn').textContent = 'Sell/Short BTC';
      }
    }

    function updateTradeInfo() {
      const amount = parseFloat(document.getElementById('tradeAmount').value) || 0;
      const leverage = parseInt(document.querySelector('.leverage-btn.active').textContent) || 1;
      const margin = (amount * sliderValue / 100) / leverage;
      document.getElementById('marginValue').textContent = margin.toFixed(2) + ' USDT';
      document.getElementById('availableValue').textContent = (10000 - margin).toFixed(2) + ' USDT';
      document.getElementById('maxValue').textContent = (amount * sliderValue / 100).toFixed(4) + ' BTC';
      document.getElementById('liqPrice').textContent = tradeType === 'buy' 
        ? (currentPrice * 0.9).toFixed(2) + ' USDT' 
        : (currentPrice * 1.1).toFixed(2) + ' USDT';
    }

    function toggleTPSL() {
      const checkbox = document.getElementById('tpSlCheckbox');
      if (checkbox.checked) {
        // Add TP/SL inputs
        const panel = document.querySelector('.trade-panel');
        const existingInputs = document.querySelector('.tp-sl-inputs');
        if (!existingInputs) {
          const div = document.createElement('div');
          div.className = 'tp-sl-inputs';
          div.innerHTML = `
            <div class="form-group" style="margin-top: 12px;">
              <label class="form-label">Take Profit (USDT)</label>
              <input type="number" class="form-input" placeholder="0.00">
            </div>
            <div class="form-group">
              <label class="form-label">Stop Loss (USDT)</label>
              <input type="number" class="form-input" placeholder="0.00">
            </div>
          `;
          panel.insertBefore(div, document.getElementById('submitBtn'));
        }
      } else {
        const existingInputs = document.querySelector('.tp-sl-inputs');
        if (existingInputs) existingInputs.remove();
      }
    }

    function submitOrder() {
      const amount = parseFloat(document.getElementById('tradeAmount').value) || 0;
      if (amount <= 0) {
        alert('Please enter a valid amount');
        return;
      }
      const position = {
        id: Date.now(),
        pair: 'BTCUSDT',
        side: tradeType,
        amount: amount * sliderValue / 100,
        entryPrice: currentPrice,
        leverage: parseInt(document.querySelector('.leverage-btn.active').textContent) || 1,
        pnl: 0,
        pnlPercent: 0
      };
      positions.push(position);
      renderPositions();
      alert('Order submitted successfully!');
    }

    function renderPositions() {
      const container = document.getElementById('positionsList');
      if (positions.length === 0) {
        container.innerHTML = '<div style="text-align: center; padding: 40px; color: #848E9C;">No open positions</div>';
        return;
      }
      container.innerHTML = positions.map(pos => `
        <div class="position-item">
          <div class="position-header">
            <span class="position-pair">${pos.pair}</span>
            <span class="position-side ${pos.side}">${pos.side === 'buy' ? 'Long' : 'Short'}</span>
          </div>
          <div class="position-details">
            <div class="position-detail">
              <span class="position-detail-label">Amount</span>
              <span class="position-detail-value">${pos.amount.toFixed(4)} BTC</span>
            </div>
            <div class="position-detail">
              <span class="position-detail-label">Entry Price</span>
              <span class="position-detail-value">${pos.entryPrice.toFixed(2)}</span>
            </div>
            <div class="position-detail">
              <span class="position-detail-label">Leverage</span>
              <span class="position-detail-value">${pos.leverage}x</span>
            </div>
            <div class="position-detail">
              <span class="position-detail-label">Margin</span>
              <span class="position-detail-value">${(pos.amount * pos.entryPrice / pos.leverage).toFixed(2)} USDT</span>
            </div>
          </div>
          <div class="position-pnl profit">+$0.00 (0.00%)</div>
          <button class="close-btn" onclick="closePosition(${pos.id})">Close Position</button>
        </div>
      `).join('');
    }

    function closePosition(id) {
      positions = positions.filter(p => p.id !== id);
      renderPositions();
    }

    function toggleChart() {
      const modal = document.getElementById('chartModal');
      if (modal.classList.contains('active')) {
        modal.classList.remove('active');
        if (chart) {
          chart.remove();
          chart = null;
        }
      } else {
        modal.classList.add('active');
        initChart();
      }
    }

    function initChart() {
      if (!window.LightweightCharts) return;
      chart = LightweightCharts.createChart(document.getElementById('chartContainer'), {
        width: document.getElementById('chartContainer').clientWidth,
        height: document.getElementById('chartContainer').clientHeight,
        layout: { background: { color: '#0B1426' }, textColor: '#D1D4DC' },
        grid: { vertLines: { color: '#2B3A50' }, horzLines: { color: '#2B3A50' } },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        rightPriceScale: { borderColor: '#2B3A50' },
        timeScale: { borderColor: '#2B3A50' }
      });
      candleSeries = chart.addCandlestickSeries({
        upColor: '#0ECB81', downColor: '#F64653',
        borderVisible: false, wickUpColor: '#0ECB81', wickDownColor: '#F64653'
      });
      
      // Generate sample data
      const data = [];
      let price = 80000;
      for (let i = 0; i < 100; i++) {
        const open = price;
        const close = price + (Math.random() - 0.5) * 100;
        const high = Math.max(open, close) + Math.random() * 50;
        const low = Math.min(open, close) - Math.random() * 50;
        data.push({
          time: new Date(Date.now() - (100 - i) * 60000).toISOString().split('T')[0] + 'T' + 
                new Date(Date.now() - (100 - i) * 60000).toTimeString().split(' ')[0].slice(0, 5),
          open, high, low, close
        });
        price = close;
      }
      candleSeries.setData(data);
    }

    function navigateTo(hash) {
      window.location.hash = hash;
    }

    // Initialize
    renderOrderBook();
    setInterval(() => {
      currentPrice += (Math.random() - 0.5) * 100;
      document.getElementById('currentPrice').textContent = currentPrice.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      renderOrderBook();
    }, 3000);

    document.getElementById('tradeAmount').addEventListener('input', updateTradeInfo);
    document.querySelectorAll('.leverage-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.leverage-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        updateTradeInfo();
      });
    });
  </script>
</body>
</html>
