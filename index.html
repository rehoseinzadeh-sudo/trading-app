<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1D9E75">
  <title>آکادمی ترید | آموزش حرفه‌ای</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background: #F7F7F5; color: #2C3E50; line-height: 1.6; padding-bottom: 100px; }
    .container { max-width: 800px; margin: 0 auto; padding: 16px; }
    .header { background: linear-gradient(135deg, #1D9E75 0%, #15785A 100%); color: white; padding: 24px 20px; border-radius: 16px; margin-bottom: 20px; text-align: center; }
    .header h1 { font-size: 24px; margin-bottom: 8px; }
    .header p { font-size: 14px; opacity: 0.9; }
    .nav-tabs { display: flex; background: white; border-radius: 12px; padding: 8px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .nav-tab { flex: 1; padding: 12px; text-align: center; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; }
    .nav-tab.active { background: #1D9E75; color: white; }
    .level-section { margin-bottom: 24px; }
    .level-title { font-size: 18px; font-weight: 700; color: #1D9E75; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid #1D9E75; }
    .course-card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); cursor: pointer; }
    .course-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .course-title { font-size: 18px; font-weight: 600; flex: 1; }
    .course-level { background: #1D9E75; color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; }
    .course-info { color: #7F8C8D; font-size: 14px; }
    .lesson-item { background: white; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); cursor: pointer; display: flex; align-items: center; }
    .lesson-number { width: 40px; height: 40px; background: #1D9E75; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; margin-left: 16px; flex-shrink: 0; }
    .lesson-title { flex: 1; font-size: 16px; font-weight: 500; }
    .lesson-content { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .lesson-image { width: 100%; height: 200px; object-fit: cover; border-radius: 12px; margin-bottom: 20px; }
    .lesson-content h3 { color: #1D9E75; margin: 20px 0 12px 0; font-size: 20px; }
    .lesson-content p { margin-bottom: 12px; text-align: justify; }
    .lesson-content ul { margin: 12px 0; padding-right: 20px; }
    .lesson-content li { margin-bottom: 8px; }
    .info-box { background: #E8F5E9; border-right: 4px solid #3498DB; padding: 16px; border-radius: 8px; margin: 16px 0; }
    .warning-box { background: #FFF3E0; border-right: 4px solid #F39C12; padding: 16px; border-radius: 8px; margin: 16px 0; }
    .quiz-button { width: 100%; background: #1D9E75; color: white; border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 24px; }
    .quiz-container { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .quiz-question { font-size: 18px; font-weight: 600; margin-bottom: 20px; }
    .quiz-option { background: #F7F7F5; border: 2px solid #E0E0E0; border-radius: 12px; padding: 16px; margin-bottom: 12px; cursor: pointer; }
    .quiz-option.correct { border-color: #27AE60; background: #E8F5E9; color: #27AE60; font-weight: 600; }
    .quiz-option.incorrect { border-color: #E74C3C; background: #FFEBEE; color: #E74C3C; }
    .quiz-explanation { background: #E3F2FD; border-right: 4px solid #3498DB; padding: 16px; border-radius: 8px; margin: 16px 0; display: none; }
    .quiz-explanation.show { display: block; }
    .quiz-nav { display: flex; gap: 12px; margin-top: 20px; }
    .quiz-nav button { flex: 1; padding: 14px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; }
    .btn-next { background: #1D9E75; color: white; }
    .btn-next:disabled { background: #E0E0E0; color: #7F8C8D; cursor: not-allowed; }
    .quiz-result { text-align: center; padding: 40px 20px; }
    .quiz-score { font-size: 48px; font-weight: 700; color: #1D9E75; margin-bottom: 16px; }
    .quiz-message { font-size: 18px; margin-bottom: 24px; }
    .back-button { position: fixed; bottom: 20px; left: 20px; right: 20px; background: #1D9E75; color: white; border: none; padding: 16px 24px; border-radius: 50px; cursor: pointer; font-size: 18px; font-weight: 700; box-shadow: 0 4px 12px rgba(29, 158, 117, 0.4); display: flex; align-items: center; justify-content: center; gap: 8px; z-index: 1000; }
    .back-icon { font-size: 24px; font-weight: 900; }
    .loading { text-align: center; padding: 40px; color: #7F8C8D; font-size: 18px; }
  </style>
</head>
<body>
  <div class="container" id="app">
    <div class="loading">⏳ در حال بارگذاری دروس...</div>
  </div>

  <script>
    let appData = { courses: [] };
    let groupedCourses = {};
    let currentCourse = null;
    let currentLesson = null;
    let quizState = { currentQuestion: 0, score: 0, answered: false };

    function cleanJsonKeys(obj) {
      if (Array.isArray(obj)) {
        return obj.map(item => cleanJsonKeys(item));
      } else if (obj !== null && typeof obj === 'object') {
        const cleaned = {};
        for (let key in obj) {
          const cleanKey = key.trim();
          cleaned[cleanKey] = cleanJsonKeys(obj[key]);
        }
        return cleaned;
      }
      return obj;
    }

    async function initApp() {
      try {
        const files = ['data-part1.json', 'data-part2.json', 'data-part3.json', 'data-part4.json'];
        const responses = await Promise.all(files.map(f => fetch(f).then(r => r.text())));
        
        appData.courses = [];
        responses.forEach(text => {
          try {
            const data = JSON.parse(text);
            const cleaned = cleanJsonKeys(data);
            if (cleaned.courses) {
              appData.courses.push(...cleaned.courses);
            }
          } catch (e) {
            console.error('Error parsing JSON:', e);
          }
        });

        if (appData.courses.length === 0) throw new Error('No courses found');
        
        groupedCourses = {
          'مقدماتی': appData.courses.filter(c => c.level === 'مقدماتی'),
          'میانی': appData.courses.filter(c => c.level === 'میانی'),
          'پیشرفته': appData.courses.filter(c => c.level === 'پیشرفته')
        };
        
        if (!location.hash) history.replaceState({ view: 'home' }, '', '#home');
        handleRoute();
      } catch (error) {
        console.error('Error:', error);
        document.getElementById('app').innerHTML = '<div class="loading">❌ خطا در بارگذاری داده‌ها. لطفاً صفحه را رفرش کنید.</div>';
      }
    }

    function handleRoute() {
      const hash = location.hash;
      if (hash === '#home' || hash === '') renderHome();
      else if (hash.startsWith('#course-')) renderCourseLessons(hash.replace('#course-', ''));
      else if (hash.startsWith('#lesson-')) {
        const parts = hash.replace('#lesson-', '').split('-');
        renderLesson(parts[0], parseInt(parts[1]));
      } else if (hash === '#quiz') renderQuizQuestion();
      else if (hash === '#demo') renderDemo();
      else renderHome();
    }

    function renderHome() {
      let html = `
        <div class="header">
          <h1>📚 آکادمی ترید</h1>
          <p>مسیر شما تا حرفه‌ای شدن در تحلیل بازار</p>
        </div>
        <div class="nav-tabs">
          <div class="nav-tab active"> دوره‌ها</div>
          <div class="nav-tab" onclick="navigateTo('#demo')">📈 دمو ترید</div>
          <div class="nav-tab">👤 پروفایل</div>
        </div>
      `;

      const levels = ['مقدماتی', 'میانی', 'پیشرفته'];
      const levelIcons = { 'مقدماتی': '🌱', 'میانی': '', 'پیشرفته': '🌳' };

      levels.forEach(level => {
        if (groupedCourses[level] && groupedCourses[level].length > 0) {
          html += `
            <div class="level-section">
              <div class="level-title">${levelIcons[level]} ${level}</div>
              ${groupedCourses[level].map((c, i) => `
                <div class="course-card" onclick="navigateTo('#course-${c.id}')">
                  <div class="course-header">
                    <div class="course-title">${i + 1}. ${c.title}</div>
                    <div class="course-level">${c.level}</div>
                  </div>
                  <div class="course-info">${c.lessons.length} درس</div>
                </div>
              `).join('')}
            </div>
          `;
        }
      });

      document.getElementById('app').innerHTML = html;
    }

    function renderCourseLessons(courseId) {
      currentCourse = appData.courses.find(c => c.id === courseId);
      if (!currentCourse) return navigateTo('#home');

      let html = `
        <div class="header">
          <h1>${currentCourse.title}</h1>
          <p>${currentCourse.level} • ${currentCourse.lessons.length} درس</p>
        </div>
      `;

      currentCourse.lessons.forEach((l, i) => {
        html += `
          <div class="lesson-item" onclick="navigateTo('#lesson-${currentCourse.id}-${i}')">
            <div class="lesson-number">${i + 1}</div>
            <div class="lesson-title">${l.title}</div>
          </div>
        `;
      });

      html += `<button class="back-button" onclick="navigateTo('#home')"><span class="back-icon">↶</span> بازگشت</button>`;
      document.getElementById('app').innerHTML = html;
    }

    function renderLesson(courseId, lessonIndex) {
      currentCourse = appData.courses.find(c => c.id === courseId);
      if (!currentCourse) return navigateTo('#home');
      
      currentLesson = currentCourse.lessons[lessonIndex];
      if (!currentLesson) return navigateTo(`#course-${courseId}`);

      let imageUrl = '';
      if (currentLesson.image) {
        imageUrl = currentLesson.image.trim().replace(/\s+/g, '');
      }

      let html = `
        <div class="lesson-content">
          ${imageUrl && !imageUrl.includes('PENDING') ? 
            `<img src="${imageUrl}" alt="${currentLesson.title}" class="lesson-image">` : ''}
          <h2 style="color: #1D9E75; margin-bottom: 20px;">${currentLesson.title}</h2>
          <div>${currentLesson.content}</div>
          ${currentLesson.quiz && currentLesson.quiz.length > 0 ? `
            <button class="quiz-button" onclick="startQuiz()"> شروع آزمون این درس (${currentLesson.quiz.length} سوال)</button>
          ` : ''}
        </div>
        <button class="back-button" onclick="navigateTo('#course-${courseId}')"><span class="back-icon">↶</span> بازگشت</button>
      `;

      document.getElementById('app').innerHTML = html;
      window.scrollTo(0, 0);
    }

    function renderDemo() {
      document.getElementById('app').innerHTML = `
        <div class="header">
          <h1>📈 دمو تریدینگ</h1>
          <p>تمرین معامله‌گری با پول مجازی</p>
        </div>
        <div class="lesson-content" style="text-align: center; padding: 40px;">
          <div style="font-size: 64px; margin-bottom: 20px;"></div>
          <h2 style="color: #1D9E75; margin-bottom: 16px;">به‌زودی در دسترس</h2>
          <p style="color: #7F8C8D; margin-bottom: 24px;">
            بخش دمو تریدینگ در حال توسعه است. به‌زودی می‌توانید با پول مجازی و در محیطی شبیه‌سازی‌شده، معامله‌گری را تمرین کنید.
          </p>
          <button class="quiz-button" onclick="navigateTo('#home')" style="max-width: 300px; margin: 0 auto;">
            بازگشت به صفحه اصلی
          </button>
        </div>
        <button class="back-button" onclick="navigateTo('#home')"><span class="back-icon">↶</span> بازگشت</button>
      `;
    }

    function startQuiz() {
      quizState = { currentQuestion: 0, score: 0, answered: false };
      navigateTo('#quiz');
    }

    function renderQuizQuestion() {
      if (!currentLesson || !currentLesson.quiz) return navigateTo('#home');
      const q = currentLesson.quiz[quizState.currentQuestion];
      const total = currentLesson.quiz.length;
      const num = quizState.currentQuestion + 1;

      let html = `
        <div class="quiz-container">
          <div style="text-align: center; margin-bottom: 20px; color: #7F8C8D; font-size: 14px;">سوال ${num} از ${total}</div>
          <div class="quiz-question">${q.question}</div>
          <div id="options-container">
            ${q.options.map((opt, i) => `<div class="quiz-option" onclick="selectAnswer(${i})" id="opt-${i}">${opt}</div>`).join('')}
          </div>
          <div class="quiz-explanation" id="explanation">💡 ${q.explanation}</div>
          <div class="quiz-nav">
            <button class="btn-next" id="btn-next" onclick="nextQuestion()" disabled>${num === total ? 'مشاهده نتیجه' : 'سوال بعدی ←'}</button>
          </div>
        </div>
        <button class="back-button" onclick="navigateTo('#lesson-${currentCourse.id}-${currentCourse.lessons.indexOf(currentLesson)}')"><span class="back-icon">↶</span> خروج از آزمون</button>
      `;

      document.getElementById('app').innerHTML = html;
      quizState.answered = false;
    }

    function selectAnswer(index) {
      if (quizState.answered) return;
      quizState.answered = true;
      const q = currentLesson.quiz[quizState.currentQuestion];
      if (index === q.correct) quizState.score++;

      document.querySelectorAll('.quiz-option').forEach((el, i) => {
        el.style.pointerEvents = 'none';
        if (i === q.correct) el.classList.add('correct');
        if (i === index && i !== q.correct) el.classList.add('incorrect');
      });

      document.getElementById('explanation').classList.add('show');
      document.getElementById('btn-next').disabled = false;
    }

    function nextQuestion() {
      quizState.currentQuestion++;
      if (quizState.currentQuestion >= currentLesson.quiz.length) showQuizResult();
      else renderQuizQuestion();
    }

    function showQuizResult() {
      const total = currentLesson.quiz.length;
      const score = quizState.score;
      const pct = Math.round((score / total) * 100);
      let msg = pct === 100 ? ' عالی! همه سوالات درست بود!' : 
                pct >= 70 ? '✅ آفرین! عملکرد خوبی داشتید.' : 
                pct >= 50 ? '👍 خوب بود، اما جای پیشرفت دارید.' : 
                '📚 پیشنهاد می‌کنیم درس را دوباره مرور کنید.';

      document.getElementById('app').innerHTML = `
        <div class="quiz-container">
          <div class="quiz-result">
            <div class="quiz-score">${score} از ${total}</div>
            <div class="quiz-message">${msg}</div>
            <button class="quiz-button" onclick="navigateTo('#lesson-${currentCourse.id}-${currentCourse.lessons.indexOf(currentLesson)}')" style="max-width: 300px;">بازگشت به درس</button>
          </div>
        </div>
        <button class="back-button" onclick="navigateTo('#lesson-${currentCourse.id}-${currentCourse.lessons.indexOf(currentLesson)}')"><span class="back-icon"></span> بازگشت</button>
      `;
    }

    function navigateTo(hash) {
      history.pushState({ hash }, '', hash);
      handleRoute();
    }

    window.addEventListener('popstate', () => handleRoute());
    initApp();
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js').catch(console.error);
  </script>
</body>
</html>
