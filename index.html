<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#00D68F">
  <title>آکادمی ترید</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, Arial, sans-serif; background: #F5F5F5; color: #1A1A1A; line-height: 1.5; width: 100%; overflow-x: hidden; }
    .container { max-width: 100%; margin: 0 auto; width: 100%; }
    
    /* استایل‌های عمومی اپ */
    .header { background: linear-gradient(135deg, #1D9E75 0%, #15785A 100%); color: white; padding: 20px 16px; border-radius: 12px; margin-bottom: 16px; text-align: center; }
    .header h1 { font-size: 20px; margin-bottom: 6px; }
    .header p { font-size: 13px; opacity: 0.9; }
    .nav-tabs { display: flex; background: white; border-radius: 10px; padding: 6px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .nav-tab { flex: 1; padding: 10px; text-align: center; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; }
    .nav-tab.active { background: #1D9E75; color: white; }
    .level-card { background: white; border-radius: 12px; padding: 24px 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); cursor: pointer; text-align: center; }
    .level-icon { font-size: 48px; margin-bottom: 10px; }
    .level-title { font-size: 18px; font-weight: 700; color: #1D9E75; margin-bottom: 6px; }
    .level-count { color: #7F8C8D; font-size: 13px; font-weight: 500; }
    .course-card { background: white; border-radius: 10px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); cursor: pointer; }
    .course-title { font-size: 15px; font-weight: 600; }
    .course-info { color: #7F8C8D; font-size: 12px; margin-top: 4px; }
    .lesson-item { background: white; border-radius: 10px; padding: 14px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); cursor: pointer; display: flex; align-items: center; }
    .lesson-number { width: 36px; height: 36px; background: #A7D7C5; color: #1D9E75; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; margin-left: 12px; flex-shrink: 0; font-size: 14px; }
    .lesson-title { flex: 1; font-size: 14px; font-weight: 500; }
    .lesson-content { background: white; border-radius: 10px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .lesson-content h3 { color: #1D9E75; margin: 16px 0 10px 0; font-size: 16px; }
    .lesson-content p { margin-bottom: 10px; text-align: justify; font-size: 14px; unicode-bidi: embed; }
    .lesson-content ul { margin: 10px 0; padding-right: 18px; font-size: 14px; }
    .lesson-content li { margin-bottom: 6px; unicode-bidi: embed; }
    .lesson-content strong { unicode-bidi: embed; }
    .info-box { background: #E8F5E9; border-right: 3px solid #3498DB; padding: 12px; border-radius: 6px; margin: 12px 0; font-size: 13px; unicode-bidi: embed; }
    .warning-box { background: #FFF3E0; border-right: 3px solid #F39C12; padding: 12px; border-radius: 6px; margin: 12px 0; font-size: 13px; unicode-bidi: embed; }
    .quiz-button { width: 100%; background: #6BC4A0; color: white; border: none; padding: 14px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 20px; }
    .quiz-container { background: white; border-radius: 10px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .quiz-question { font-size: 15px; font-weight: 600; margin-bottom: 16px; unicode-bidi: embed; }
    .quiz-option { background: #F7F7F5; border: 2px solid #E0E0E0; border-radius: 10px; padding: 12px; margin-bottom: 10px; cursor: pointer; font-size: 14px; unicode-bidi: embed; }
    .quiz-option.correct { border-color: #27AE60; background: #E8F5E9; color: #27AE60; font-weight: 600; }
    .quiz-option.incorrect { border-color: #E74C3C; background: #FFEBEE; color: #E74C3C; }
    .quiz-explanation { background: #E3F2FD; border-right: 3px solid #3498DB; padding: 12px; border-radius: 6px; margin: 12px 0; display: none; font-size: 13px; unicode-bidi: embed; }
    .quiz-explanation.show { display: block; }
    .quiz-nav { display: flex; gap: 10px; margin-top: 16px; }
    .quiz-nav button { flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .btn-next { background: #1D9E75; color: white; }
    .btn-next:disabled { background: #E0E0E0; color: #7F8C8D; cursor: not-allowed; }
    .quiz-result { text-align: center; padding: 32px 16px; }
    .quiz-score { font-size: 40px; font-weight: 700; color: #1D9E75; margin-bottom: 12px; }
    .quiz-message { font-size: 16px; margin-bottom: 20px; }
    .back-button { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); width: 180px; background: #6366F1; color: white; border: none; padding: 10px 16px; border-radius: 50px; cursor: pointer; font-size: 14px; font-weight: 600; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4); display: flex; align-items: center; justify-content: center; gap: 6px; z-index: 1000; }
    .loading { text-align: center; padding: 32px; color: #7F8C8D; font-size: 16px; }
    
    /* ===== استایل‌های دمو تریدینگ (شبیه CoinEx) ===== */
    .trade-page { background: white; min-height: 100vh; padding-bottom: 60px; }
    
    /* هدر جفت ارز */
    .trade-header { background: white; padding: 12px 16px; border-bottom: 1px solid #E8E8E8; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .pair-info { display: flex; align-items: center; gap: 12px; }
    .pair-selector { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .pair-name { font-size: 16px; font-weight: 700; color: #1A1A1A; }
    .pair-dropdown { font-size: 10px; color: #7F8C8D; }
    .pair-change { font-size: 13px; color: #0ECB81; font-weight: 600; }
    .chart-toggle { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; background: #F5F5F5; border-radius: 6px; }
    .chart-toggle svg { width: 20px; height: 20px; }
    
    /* لایه اصلی: دو ستون */
    .trade-main { display: flex; gap: 12px; padding: 12px; }
    
    /* ستون چپ: فرم سفارش */
    .trade-form-col { flex: 1; max-width: 45%; }
    .trade-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .trade-tab { flex: 1; padding: 10px; border: none; border-radius: 4px; font-size: 13px; font-weight: 600; cursor: pointer; background: #F5F5F5; color: #7F8C8D; }
    .trade-tab.buy { background: #0ECB81; color: white; }
    .trade-tab.sell { background: #F64653; color: white; }
    
    .leverage-selector { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 4px; }
    .leverage-btn { padding: 6px 12px; background: #F5F5F5; border: 1px solid #E0E0E0; border-radius: 4px; color: #1A1A1A; font-size: 12px; cursor: pointer; white-space: nowrap; }
    .leverage-btn.active { background: #F0B90B; color: #1A1A1A; border-color: #F0B90B; font-weight: 600; }
    
    .form-group { margin-bottom: 12px; }
    .form-label { font-size: 12px; color: #7F8C8D; margin-bottom: 6px; display: block; }
    .form-input { width: 100%; padding: 10px; background: #F5F5F5; border: 1px solid #E0E0E0; border-radius: 4px; color: #1A1A1A; font-size: 13px; }
    .form-input:focus { outline: none; border-color: #F0B90B; }
    
    .amount-slider { margin-bottom: 16px; }
    .slider-container { position: relative; height: 32px; display: flex; align-items: center; }
    .slider-track { position: absolute; width: 100%; height: 3px; background: #E0E0E0; border-radius: 2px; }
    .slider-fill { position: absolute; height: 100%; background: #F0B90B; border-radius: 2px; width: 0%; }
    .slider-dot { position: absolute; width: 18px; height: 18px; background: #F0B90B; border-radius: 50%; cursor: grab; left: 0%; transform: translateX(-50%); box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
    .slider-dot:active { cursor: grabbing; }
    .slider-markers { display: flex; justify-content: space-between; margin-top: 6px; }
    .slider-marker { width: 6px; height: 6px; background: #E0E0E0; border-radius: 50%; }
    
    .trade-info-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 12px; border-bottom: 1px solid #F5F5F5; }
    .trade-info-label { color: #7F8C8D; }
    .trade-info-value { color: #1A1A1A; font-weight: 500; }
    
    .tp-sl-checkbox { display: flex; align-items: center; gap: 6px; margin: 12px 0; cursor: pointer; }
    .tp-sl-checkbox input[type="checkbox"] { width: 16px; height: 16px; accent-color: #F0B90B; }
    .tp-sl-checkbox label { font-size: 13px; color: #1A1A1A; cursor: pointer; }
    
    .submit-btn { width: 100%; padding: 14px; border: none; border-radius: 4px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 8px; }
    .submit-btn.buy { background: #0ECB81; color: white; }
    .submit-btn.sell { background: #F64653; color: white; }
    
    /* ستون راست: Order Book */
    .order-book-col { flex: 1; max-width: 55%; }
    .price-display { text-align: center; padding: 12px 0; }
    .current-price { font-size: 28px; font-weight: 700; color: #0ECB81; margin-bottom: 2px; }
    .price-change-text { font-size: 12px; color: #7F8C8D; }
    
    .order-book { background: white; border: 1px solid #E8E8E8; border-radius: 6px; overflow: hidden; }
    .order-header { display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 6px 10px; background: #F5F5F5; font-size: 11px; color: #7F8C8D; font-weight: 500; }
    .order-row { display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 4px 10px; font-size: 12px; cursor: pointer; }
    .order-row.ask { background: rgba(246, 70, 83, 0.08); }
    .order-row.bid { background: rgba(14, 203, 129, 0.08); }
    .order-row .price { font-weight: 600; }
    .order-row .price.ask { color: #F64653; }
    .order-row .price.bid { color: #0ECB81; }
    .order-row .amount { color: #1A1A1A; text-align: left; }
    .order-row .total { color: #7F8C8D; text-align: left; font-size: 11px; }
    
    /* تب‌های پوزیشن */
    .positions-tabs { display: flex; border-bottom: 1px solid #E8E8E8; margin-top: 12px; }
    .position-tab { flex: 1; padding: 10px; text-align: center; font-size: 13px; color: #7F8C8D; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .position-tab.active { color: #F0B90B; border-bottom-color: #F0B90B; font-weight: 600; }
    
    .positions-content { padding: 12px; }
    .position-item { background: #F5F5F5; border-radius: 6px; padding: 12px; margin-bottom: 8px; }
    .position-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .position-pair { font-size: 14px; font-weight: 700; color: #1A1A1A; }
    .position-side { font-size: 12px; padding: 3px 8px; border-radius: 3px; font-weight: 600; }
    .position-side.long { background: rgba(14, 203, 129, 0.15); color: #0ECB81; }
    .position-side.short { background: rgba(246, 70, 83, 0.15); color: #F64653; }
    .position-details { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 12px; margin-bottom: 8px; }
    .position-detail { display: flex; justify-content: space-between; }
    .position-detail-label { color: #7F8C8D; }
    .position-detail-value { color: #1A1A1A; }
    .position-pnl { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
    .position-pnl.profit { color: #0ECB81; }
    .position-pnl.loss { color: #F64653; }
    .close-btn { width: 100%; padding: 10px; background: #F64653; color: white; border: none; border-radius: 4px; font-size: 13px; font-weight: 600; cursor: pointer; }
    
    .empty-state { text-align: center; padding: 32px 16px; color: #7F8C8D; font-size: 13px; }
    
    /* مودال چارت */
    .chart-modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: white; z-index: 1000; flex-direction: column; }
    .chart-modal.active { display: flex; }
    .chart-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid #E8E8E8; background: white; }
    .chart-back { font-size: 20px; cursor: pointer; color: #1A1A1A; padding: 4px 8px; }
    .chart-title { font-size: 14px; font-weight: 600; }
    .chart-actions { display: flex; gap: 8px; }
    .chart-action-btn { padding: 6px 12px; background: #F5F5F5; border: none; border-radius: 4px; font-size: 12px; cursor: pointer; }
    
    .chart-body { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .chart-main { flex: 1; position: relative; min-height: 300px; }
    .chart-container { width: 100%; height: 100%; background: white; }
    .resize-handle { position: absolute; bottom: 0; left: 0; right: 0; height: 8px; background: #F0B90B; cursor: ns-resize; opacity: 0.6; }
    .resize-handle:hover { opacity: 1; }
    
    .indicators-panel { background: #F5F5F5; border-top: 1px solid #E8E8E8; padding: 8px 16px; display: flex; gap: 8px; overflow-x: auto; }
    .indicator-btn { padding: 6px 12px; background: white; border: 1px solid #E0E0E0; border-radius: 4px; font-size: 11px; cursor: pointer; white-space: nowrap; }
    .indicator-btn.active { background: #F0B90B; border-color: #F0B90B; font-weight: 600; }
    
    .indicator-charts { height: 200px; background: white; border-top: 1px solid #E8E8E8; }
    
    /* Responsive */
    @media (max-width: 768px) {
      .trade-main { flex-direction: column; }
      .trade-form-col, .order-book-col { max-width: 100%; }
      .current-price { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="container" id="app">
    <div class="loading">⏳ در حال بارگذاری...</div>
  </div>

  <script>
    let appData = { courses: [] };
    let currentCourse = null;
    let currentLesson = null;
    let quizState = { currentQuestion: 0, score: 0, answered: false };
    let demoAccount = { balance: 10000, equity: 10000, positions: [], pendingOrders: [], history: [] };
    let chart, candleSeries, currentPrice = 80027, ws;
    let currentTimeframe = '15m';
    let orderBookData = { bids: [], asks: [] };
    let tradeType = 'buy';
    let sliderValue = 0;
    let activeTab = 'positions';
    let activeIndicators = [];

    function cleanJsonKeys(obj) {
      if (Array.isArray(obj)) return obj.map(item => cleanJsonKeys(item));
      else if (obj !== null && typeof obj === 'object') {
        const cleaned = {};
        for (let key in obj) { const cleanKey = key.trim(); cleaned[cleanKey] = cleanJsonKeys(obj[key]); }
        return cleaned;
      }
      return obj;
    }

    function getCleanImageUrl(url) {
      if (!url) return null;
      return String(url).replace(/\s+/g, '');
    }

    function getLessonIcon(title) {
      const t = String(title).toLowerCase();
      if (t.includes('کندل') || t.includes('الگو')) return '🕯️';
      if (t.includes('بلاکچین') || t.includes('کریپتو') || t.includes('رمز')) return '🔗';
      if (t.includes('کیف پول')) return '';
      if (t.includes('بازار')) return '📊';
      if (t.includes('فارکس') || t.includes('ارز')) return '💱';
      if (t.includes('حمایت') || t.includes('مقاومت')) return '📈';
      if (t.includes('روند')) return '📉';
      if (t.includes('پرایس اکشن')) return '💹';
      if (t.includes('لوریج') || t.includes('مارجین')) return '⚖️';
      if (t.includes('ریسک') || t.includes('مدیریت سرمایه')) return '🛡️';
      if (t.includes('آزمون') || t.includes('تست')) return '📝';
      if (t.includes('اسمارت') || t.includes('smart')) return '🧠';
      if (t.includes('ict') || t.includes('kill zone')) return '🎯';
      if (t.includes('استراتژی')) return '⚙️';
      if (t.includes('روانشناسی') || t.includes('ژورنال')) return '';
      return '📚';
    }

    async function initApp() {
      try {
        const files = ['data-part1.json', 'data-part2.json', 'data-part3.json', 'data-part4.json', 'data-part5.json'];
        const responses = await Promise.all(files.map(f => fetch(f).then(r => r.text()).catch(() => null)));
        appData.courses = [];
        responses.forEach((text, index) => {
          if (!text) return;
          try {
            const data = JSON.parse(text);
            const cleaned = cleanJsonKeys(data);
            if (cleaned.courses && Array.isArray(cleaned.courses)) {
              cleaned.courses.forEach(course => {
                const normalizedCourse = {
                  id: String(course.id || '').replace(/\s+/g, ''),
                  level: String(course.level || '').trim(),
                  title: String(course.title || '').trim(),
                  lessons: Array.isArray(course.lessons) ? course.lessons.map(l => ({
                    id: String(l.id || '').replace(/\s+/g, ''),
                    title: String(l.title || '').trim(),
                    image: String(l.image || '').replace(/\s+/g, ''),
                    content: l.content || '',
                    quiz: Array.isArray(l.quiz) ? l.quiz : []
                  })) : []
                };
                appData.courses.push(normalizedCourse);
              });
            }
          } catch (e) { console.error('خطا در خواندن فایل JSON شماره', index + 1, e); }
        });
        if (appData.courses.length === 0) {
          document.getElementById('app').innerHTML = '<div class="loading">❌ خطا در بارگذاری دوره‌ها</div>';
          return;
        }
        loadDemoAccount();
        if (!location.hash) history.replaceState({ view: 'home' }, '', '#home');
        handleRoute();
      } catch (error) {
        console.error('Error:', error);
        document.getElementById('app').innerHTML = '<div class="loading">❌ خطای سیستم</div>';
      }
    }

    function handleRoute() {
      const hash = location.hash;
      if (hash === '#home' || hash === '' || !hash) renderHome();
      else if (hash.startsWith('#level-')) renderLevelCourses(hash.replace('#level-', ''));
      else if (hash.startsWith('#course-')) renderCourseLessons(hash.replace('#course-', ''));
      else if (hash.startsWith('#lesson-')) {
        const parts = hash.replace('#lesson-', '').split('-');
        renderLesson(parts[0], parseInt(parts[1]));
      }
      else if (hash === '#quiz') renderQuizQuestion();
      else if (hash === '#demo') renderTradePage();
      else renderHome();
    }

    function renderHome() {
      const levels = [
        { id: 'beginner', icon: '🌱', title: 'دوره مقدماتی', levelName: 'مقدماتی', count: appData.courses.filter(c => c.level.includes('مقدماتی')).length },
        { id: 'intermediate', icon: '🌿', title: 'دوره میانی', levelName: 'میانی', count: appData.courses.filter(c => c.level.includes('میانی')).length },
        { id: 'advanced', icon: '🌳', title: 'دوره پیشرفته', levelName: 'پیشرفته', count: appData.courses.filter(c => c.level.includes('پیشرفته')).length }
      ];
      let html = `
        <div class="header"><h1>📚 آکادمی ترید</h1><p>مسیر شما تا حرفه‌ای شدن در تحلیل بازار</p></div>
        <div class="nav-tabs">
          <div class="nav-tab active">📚 دوره‌ها</div>
          <div class="nav-tab" onclick="navigateTo('#demo')">📈 دمو ترید</div>
          <div class="nav-tab">👤 پروفایل</div>
        </div>
      `;
      levels.forEach(level => {
        if (level.count > 0) {
          html += `<div class="level-card" onclick="navigateTo('#level-${level.id}')"><div class="level-icon">${level.icon}</div><div class="level-title">${level.title}</div><div class="level-count">${level.count} دوره آموزشی</div></div>`;
        }
      });
      document.getElementById('app').innerHTML = html;
    }

    function renderLevelCourses(levelId) {
      let levelName = '';
      if (levelId === 'beginner') levelName = 'مقدماتی';
      else if (levelId === 'intermediate') levelName = 'میانی';
      else if (levelId === 'advanced') levelName = 'پیشرفته';
      else levelName = decodeURIComponent(levelId);
      const courses = appData.courses.filter(c => c.level.includes(levelName));
      if (courses.length === 0) {
        document.getElementById('app').innerHTML = `<div class="loading">⚠️ هیچ دوره‌ای در سطح "${levelName}" یافت نشد</div><button class="back-button" onclick="navigateTo('#home')">↶ بازگشت</button>`;
        return;
      }
      let html = `<div class="header"><h1>${levelName}</h1><p>${courses.length} دوره در این سطح</p></div>`;
      courses.forEach((c, i) => {
        html += `<div class="course-card" onclick="navigateTo('#course-${c.id}')"><div class="course-title">${i + 1}. ${c.title}</div><div class="course-info">${c.lessons.length} درس</div></div>`;
      });
      html += `<button class="back-button" onclick="navigateTo('#home')">↶ بازگشت</button>`;
      document.getElementById('app').innerHTML = html;
    }

    function renderCourseLessons(courseId) {
      const cleanCourseId = String(courseId).replace(/\s+/g, '');
      const currentCourse = appData.courses.find(c => c.id === cleanCourseId);
      if (!currentCourse) {
        document.getElementById('app').innerHTML = `<div class="loading">❌ دوره پیدا نشد</div><button class="back-button" onclick="navigateTo('#home')">↶ بازگشت</button>`;
        return;
      }
      const lessons = currentCourse.lessons || [];
      let html = `<div class="header"><h1>${currentCourse.title}</h1><p>${lessons.length} درس</p></div>`;
      if (lessons.length === 0) {

    function setupResize() {
      const handle = document.getElementById('resizeHandle');
      const chartMain = document.getElementById('chartMain');
      if (!handle || !chartMain) return;
      
      let isResizing = false;
      let startY, startHeight;
      
      handle.addEventListener('mousedown', startResize);
      handle.addEventListener('touchstart', startResize, {passive: true});
      
      function startResize(e) {
        isResizing = true;
        startY = e.touches ? e.touches[0].clientY : e.clientY;
        startHeight = chartMain.clientHeight;
        document.addEventListener('mousemove', doResize);
        document.addEventListener('touchmove', doResize, {passive: true});
        document.addEventListener('mouseup', stopResize);
        document.addEventListener('touchend', stopResize);
        e.preventDefault();
      }
      
      function doResize(e) {
        if (!isResizing) return;
        const y = e.touches ? e.touches[0].clientY : e.clientY;
        const delta = startY - y;
        const newHeight = Math.max(200, Math.min(600, startHeight + delta));
        chartMain.style.height = newHeight + 'px';
        if (chart) {
          chart.applyOptions({ width: chartMain.clientWidth, height: newHeight - 8 });
        }
      }
      
      function stopResize() {
        isResizing = false;
        document.removeEventListener('mousemove', doResize);
        document.removeEventListener('touchmove', doResize);
        document.removeEventListener('mouseup', stopResize);
        document.removeEventListener('touchend', stopResize);
      }
    }

    function initChart() {
      const container = document.getElementById('chartContainer');
      if (!container) return;
      
      if (typeof LightweightCharts === 'undefined') {
        container.innerHTML = '<div class="empty-state">📊 خطا در بارگذاری چارت</div>';
        return;
      }
      
      try {
        chart = LightweightCharts.createChart(container, {
          width: container.clientWidth,
          height: container.clientHeight - 8,
          layout: { background: { color: '#FFFFFF' }, textColor: '#1A1A1A' },
          grid: { vertLines: { color: '#F0F0F0' }, horzLines: { color: '#F0F0F0' } },
          crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
          rightPriceScale: { borderColor: '#E8E8E8' },
          timeScale: { borderColor: '#E8E8E8', timeVisible: true },
          handleScroll: { vertTouchDrag: false, horzTouchDrag: true },
          handleScale: { axisPressedMouseMove: true, mouseWheel: true, pinch: true }
        });
        
        candleSeries = chart.addCandlestickSeries({
          upColor: '#0ECB81', downColor: '#F64653',
          borderVisible: false, wickUpColor: '#0ECB81', wickDownColor: '#F64653',
        });
        
        fetch(`https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=${currentTimeframe}&limit=500`)
          .then(r => r.json())
          .then(data => {
            const candles = data.map(k => ({
              time: k[0] / 1000,
              open: parseFloat(k[1]),
              high: parseFloat(k[2]),
              low: parseFloat(k[3]),
              close: parseFloat(k[4]),
            }));
            candleSeries.setData(candles);
            currentPrice = candles[candles.length - 1].close;
            updatePriceDisplay();
          })
          .catch(err => {
            console.error('Error fetching historical data:', err);
          });
        
        ws = new WebSocket(`wss://stream.binance.com:9443/ws/btcusdt@kline_${currentTimeframe}`);
        ws.onmessage = (event) => {
          const data = JSON.parse(event.data);
          const k = data.k;
          const candle = {
            time: k.t / 1000,
            open: parseFloat(k.o),
            high: parseFloat(k.h),
            low: parseFloat(k.l),
            close: parseFloat(k.c),
          };
          if (candleSeries) candleSeries.update(candle);
          currentPrice = candle.close;
          updatePriceDisplay();
        };
        ws.onerror = (err) => console.error('WebSocket error:', err);
      } catch (err) {
        console.error('Chart initialization error:', err);
        container.innerHTML = '<div class="empty-state">📊 خطا در بارگذاری چارت</div>';
      }
    }

    function setupSlider() {
      const sliderDot = document.getElementById('sliderDot');
      const sliderFill = document.getElementById('sliderFill');
      const sliderContainer = document.querySelector('.slider-container');
      if (!sliderDot || !sliderFill || !sliderContainer) return;
      
      let isDragging = false;

      sliderDot.addEventListener('mousedown', startDrag);
      sliderDot.addEventListener('touchstart', startDrag, {passive: true});
      document.addEventListener('mousemove', drag);
      document.addEventListener('touchmove', drag, {passive: true});
      document.addEventListener('mouseup', endDrag);
      document.addEventListener('touchend', endDrag);

      function startDrag(e) {
        isDragging = true;
        e.preventDefault();
      }

      function drag(e) {
        if (!isDragging) return;
        const rect = sliderContainer.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        let x = ((clientX - rect.left) / rect.width) * 100;
        x = Math.max(0, Math.min(100, x));
        sliderValue = x;
        sliderDot.style.left = x + '%';
        sliderFill.style.width = x + '%';
        updateTradeInfo();
      }

      function endDrag() {
        isDragging = false;
      }
    }

              <div class="position-detail">
                <span class="position-detail-label">Amount</span>
                <span class="position-detail-value">${h.amount.toFixed(4)} BTC</span>
              </div>
              <div class="position-detail">
                <span class="position-detail-label">Entry</span>
                <span class="position-detail-value">${h.entryPrice.toFixed(2)}</span>
              </div>
              <div class="position-detail">
                <span class="position-detail-label">Exit</span>
                <span class="position-detail-value">${h.closePrice?.toFixed(2) || '--'}</span>
              </div>
              <div class="position-detail">
                <span class="position-detail-label">PnL</span>
                <span class="position-detail-value">${h.pnl?.toFixed(2) || '0.00'} USDT</span>
              </div>
            </div>
          </div>
        `).join('');
      }
    }

    function closePosition(id) {
      const posIndex = demoAccount.positions.findIndex(p => p.id === id);
      if (posIndex === -1) return;
      const pos = demoAccount.positions[posIndex];
      pos.closePrice = currentPrice;
      pos.pnl = (pos.side === 'buy' ? 1 : -1) * (currentPrice - pos.entryPrice) * pos.amount;
      demoAccount.balance += pos.pnl;
      demoAccount.history.push(pos);
      demoAccount.positions.splice(posIndex, 1);
      saveDemoAccount();
      renderPositions();
    }

    function loadDemoAccount() {
      const saved = localStorage.getItem('demoAccount');
      if (saved) {
        try { demoAccount = JSON.parse(saved); } catch (e) { console.error('Error loading demo account:', e); }
      }
    }

    function saveDemoAccount() {
      localStorage.setItem('demoAccount', JSON.stringify(demoAccount));
    }

    function renderQuizQuestion() {
      if (!currentLesson || !currentLesson.quiz || currentLesson.quiz.length === 0) return navigateTo('#home');
      const q = currentLesson.quiz[quizState.currentQuestion];
      const total = currentLesson.quiz.length;
      const num = quizState.currentQuestion + 1;
      let html = `
        <div class="quiz-container">
          <div style="text-align: center; margin-bottom: 16px; color: #7F8C8D; font-size: 13px;">سوال ${num} از ${total}</div>
          <div class="quiz-question">${q.question}</div>
          <div id="options-container">
            ${q.options.map((opt, i) => `<div class="quiz-option" onclick="selectAnswer(${i})" id="opt-${i}">${opt}</div>`).join('')}
          </div>
          <div class="quiz-explanation" id="explanation">💡 ${q.explanation}</div>
          <div class="quiz-nav">
            <button class="btn-next" id="btn-next" onclick="nextQuestion()" disabled>${num === total ? 'مشاهده نتیجه' : 'سوال بعدی ←'}</button>
          </div>
        </div>
        <button class="back-button" onclick="navigateTo('#course-${currentCourse.id}')">↶ خروج از آزمون</button>
      `;
      document.getElementById('app').innerHTML = html;
      quizState.answered = false;
    }

    function selectAnswer(index) {
      if (quizState.answered) return;
      quizState.answered = true;
      const q = currentLesson.quiz[quizState.currentQuestion];
      if (index === q.correct) quizState.score++;
      document.querySelectorAll('.quiz-option').forEach((el, i) => {
        el.style.pointerEvents = 'none';
        if (i === q.correct) el.classList.add('correct');
        if (i === index && i !== q.correct) el.classList.add('incorrect');
      });
      document.getElementById('explanation').classList.add('show');
      document.getElementById('btn-next').disabled = false;
    }

    function nextQuestion() {
      quizState.currentQuestion++;
      if (quizState.currentQuestion >= currentLesson.quiz.length) showQuizResult();
      else renderQuizQuestion();
    }

    function showQuizResult() {
      const total = currentLesson.quiz.length;
      const score = quizState.score;
      const pct = Math.round((score / total) * 100);
      let msg = pct === 100 ? '🎉 عالی!' : pct >= 70 ? '✅ آفرین!' : pct >= 50 ? '👍 خوب بود' : '📚 دوباره مرور کنید';
      document.getElementById('app').innerHTML = `
        <div class="quiz-container"><div class="quiz-result"><div class="quiz-score">${score} از ${total}</div><div class="quiz-message">${msg}</div><button class="quiz-button" onclick="navigateTo('#course-${currentCourse.id}')" style="max-width: 280px;">بازگشت به دوره</button></div></div>
        <button class="back-button" onclick="navigateTo('#course-${currentCourse.id}')">↶ بازگشت</button>
      `;
    }

    function navigateTo(hash) {
      if (ws && hash !== '#demo') { ws.close(); ws = null; }
      if (chart && hash !== '#demo') { chart.remove(); chart = null; }
      history.pushState({ hash }, '', hash);
      handleRoute();
    }
    
    window.addEventListener('popstate', () => handleRoute());
    window.addEventListener('resize', () => {
      if (chart && document.getElementById('chartModal')?.classList.contains('active')) {
        const container = document.getElementById('chartContainer');
        if (container) chart.applyOptions({ width: container.clientWidth, height: container.clientHeight - 8 });
      }
    });
    
    setInterval(() => {
      if (document.getElementById('chartModal')?.classList.contains('active')) {
        currentPrice += (Math.random() - 0.5) * 50;
        updatePriceDisplay();
        renderOrderBook();
      }
    }, 3000);
    
    initApp();
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js?v=99').catch(console.error);
    }
  </script>
</body>
</html>
