<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

    .order-header { display: grid; grid-template-columns: 1fr 1fr; padding: 6px 12px; background: #F5F5F5; font-size: 10px; color: #7F8C8D; font-weight: 600; border-bottom: 1px solid #E8E8E8; }

    .order-header span:last-child { text-align: left; padding-left: 8px; }

    .order-row .col-price { font-weight: 700; text-align: left; font-size: 10px; font-variant-numeric: tabular-nums; padding-left: 8px; }

    .chart-section { border-bottom: 1px solid #E8E8E8; background: white; }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .chart-close-btn { font-size: 18px; cursor: pointer; color: #F64653; padding: 2px 8px; font-weight: 900; background: none; border: none; margin-left: auto; }
    .chart-main-inline { position: relative; width: 100%; height: 500px; flex-shrink: 0; }
    .chart-container { width: 100%; height: 100%; background: white; }
    
    .positions-tabs { display: flex; border-bottom: 1px solid #E8E8E8; }
    .position-tab { flex: 1; padding: 10px; text-align: center; font-size: 12px; color: #7F8C8D; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .position-tab.active { color: #F0B90B; border-bottom-color: #F0B90B; font-weight: 600; }
    .positions-content { padding: 10px; padding-bottom: 100px; }

    .position-pair { font-size: 13px; font-weight: 700; color: #2196F3; }
    .position-side { font-size: 11px; padding: 2px 6px; border-radius: 3px; font-weight: 600; }

    .position-side.sell { background: rgba(246, 70, 83, 0.15); color: #F64653; }

    .position-detail { display: flex; justify-content: space-between; padding: 2px 0; }
    .position-detail-label { color: #64B5F6; }

    .position-pnl { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
    .position-pnl.profit { color: #0ECB81; }
    .position-pnl.loss { color: #F64653; }
    .close-btn { width: 100%; padding: 8px; background: #F64653; color: white; border: none; border-radius: 4px; font-size: 12px; font-weight: 600; cursor: pointer; }

    .profile-page { padding: 12px; }
    .profile-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px 14px; border-radius: 12px; text-align: center; margin-bottom: 12px; }
    .profile-avatar { width: 70px; height: 70px; border-radius: 50%; background: white; display: flex; align-items: center; justify-content: center; font-size: 32px; margin: 0 auto 10px; }
    .profile-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .profile-email { font-size: 11px; opacity: 0.8; }
    .profile-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .stat-card { background: white; border-radius: 10px; padding: 12px 8px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .stat-value { font-size: 18px; font-weight: 700; color: #1D9E75; }
    .stat-label { font-size: 10px; color: #7F8C8D; margin-top: 3px; }
    .profile-section { background: white; border-radius: 10px; padding: 12px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .profile-section-title { font-size: 13px; font-weight: 700; margin-bottom: 10px; color: #1A1A1A; }
    .profile-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #F5F5F5; }
    .profile-item:last-child { border-bottom: none; }
    .profile-item-label { font-size: 12px; color: #1A1A1A; }
    .profile-item-value { font-size: 12px; color: #7F8C8D; font-weight: 500; }
    .profile-btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 6px; }
    .profile-btn.primary { background: #1D9E75; color: white; }
    .profile-btn.secondary { background: #F5F5F5; color: #1A1A1A; }
    .profile-btn.danger { background: #FFEBEE; color: #F64653; }
    @media (max-width: 768px) { .current-price { font-size: 22px; } }

</head>
<body>
  <div class="container" id="app">
    <div class="loading">⏳ در حال بارگذاری...</div>
  </div>

  <script>
    let appData = { courses: [] };
    let currentCourse = null, currentLesson = null;
    let quizState = { currentQuestion: 0, score: 0, answered: false };
    let demoAccount = { balance: 10000, equity: 10000, positions: [], pendingOrders: [], history: [] };
    let userProfile = { name: 'کاربر آکادمی', email: 'user@academy.com', joinDate: '2026-09-06', lessonsCompleted: 0, quizzesPassed: 0, totalTrades: 0, winRate: 0 };
    let currentPrice = 0, priceUpdateInterval, pnlInterval;
    let tradeType = 'buy', sliderValue = 0;
    let activeTab = 'positions';
    let currentPair = 'BTCUSDT';
    let isChartVisible = false;
    let lastPriceFetch = 0;
    
    let pairInfo = {
      BTCUSDT: { name: 'BTC/USDT', price: 0, change: 0, decimals: 2, basePrice: 80000, cgId: 'bitcoin', tvSymbol: 'BINANCE:BTCUSDT' },
      ETHUSDT: { name: 'ETH/USDT', price: 0, change: 0, decimals: 2, basePrice: 3800, cgId: 'ethereum', tvSymbol: 'BINANCE:ETHUSDT' },
      XAUUSD:  { name: 'XAU/USD',  price: 0, change: 0, decimals: 2, basePrice: 2650, cgId: null, tvSymbol: 'OANDA:XAUUSD' },
      EURUSD:  { name: 'EUR/USD',  price: 0, change: 0, decimals: 4, basePrice: 1.0850, cgId: null, tvSymbol: 'OANDA:EURUSD' }
    };

    function cleanJsonKeys(obj) {
      if (Array.isArray(obj)) return obj.map(item => cleanJsonKeys(item));
      else if (obj !== null && typeof obj === 'object') {
        const cleaned = {};
        for (let key in obj) { const cleanKey = key.trim(); cleaned[cleanKey] = cleanJsonKeys(obj[key]); }
        return cleaned;
      }
      return obj;
    }

    function getCleanImageUrl(url) { if (!url) return null; return String(url).replace(/\s+/g, ''); }

    function getLessonIcon(title) {
      const t = String(title).toLowerCase();
      if (t.includes('کندل') || t.includes('الگو')) return '🕯️';
      if (t.includes('بلاکچین') || t.includes('کریپتو')) return '';
      if (t.includes('کیف پول')) return '👛';
      if (t.includes('بازار')) return '';
      if (t.includes('فارکس') || t.includes('ارز')) return '💱';
      if (t.includes('حمایت') || t.includes('مقاومت')) return '';
      if (t.includes('روند')) return '';
      if (t.includes('پرایس اکشن')) return '💹';
      if (t.includes('لوریج') || t.includes('مارجین')) return '⚖️';
      if (t.includes('ریسک')) return '🛡️';
      if (t.includes('آزمون')) return '';
      if (t.includes('اسمارت') || t.includes('smart')) return '🧠';
      if (t.includes('ict')) return '🎯';
      if (t.includes('استراتژی')) return '️';
      if (t.includes('روانشناسی')) return '🧘';
      return '📚';
    }

    async function initApp() {
      try {
        const files = ['data-part1.json', 'data-part2.json', 'data-part3.json', 'data-part4.json', 'data-part5.json'];
        const responses = await Promise.all(files.map(f => fetch(f).then(r => r.text()).catch(() => null)));
        appData.courses = [];
        responses.forEach((text, index) => {
          if (!text) return;
          try {
            const data = JSON.parse(text);
            const cleaned = cleanJsonKeys(data);
            if (cleaned.courses && Array.isArray(cleaned.courses)) {
              cleaned.courses.forEach(course => {
                const normalizedCourse = {
                  id: String(course.id || '').replace(/\s+/g, ''),
                  level: String(course.level || '').trim(),
                  title: String(course.title || '').trim(),
                  lessons: Array.isArray(course.lessons) ? course.lessons.map(l => ({
                    id: String(l.id || '').replace(/\s+/g, ''),
                    title: String(l.title || '').trim(),
                    image: String(l.image || '').replace(/\s+/g, ''),
                    content: l.content || '',
                    quiz: Array.isArray(l.quiz) ? l.quiz : []
                  })) : []
                };
                appData.courses.push(normalizedCourse);
              });
            }
          } catch (e) { console.error('خطا در خواندن فایل JSON شماره', index + 1, e); }
        });
        if (appData.courses.length === 0) {
          document.getElementById('app').innerHTML = '<div class="loading">❌ خطا در بارگذاری دوره‌ها</div>';
          return;
        }
        loadDemoAccount();
        loadUserProfile();
        await fetchRealPrices();
        if (!location.hash) history.replaceState({ view: 'home' }, '', '#home');
        handleRoute();
      } catch (error) {
        console.error('Error:', error);
        document.getElementById('app').innerHTML = '<div class="loading">❌ خطای سیستم</div>';
      }
    }

    async function fetchRealPrices() {
      const now = Date.now();
      if (now - lastPriceFetch < 10000) return;
      
      try {
        const cgRes = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd&include_24hr_change=true', { signal: AbortSignal.timeout(5000) });
        if (cgRes.ok) {
          const cgData = await cgRes.json();
          if (cgData.bitcoin) { pairInfo.BTCUSDT.price = cgData.bitcoin.usd; pairInfo.BTCUSDT.change = cgData.bitcoin.usd_24h_change || 0; }
          if (cgData.ethereum) { pairInfo.ETHUSDT.price = cgData.ethereum.usd; pairInfo.ETHUSDT.change = cgData.ethereum.usd_24h_change || 0; }
          lastPriceFetch = now;
          return;
        }
      } catch(e) { console.log('CoinGecko failed:', e.message); }
      
      try {
        const ccRes = await fetch('https://api.coincap.io/v2/assets?ids=bitcoin,ethereum', { signal: AbortSignal.timeout(5000) });
        if (ccRes.ok) {
          const ccData = await ccRes.json();
          ccData.data.forEach(asset => {
            const price = parseFloat(asset.priceUsd);
            const change24h = parseFloat(asset.changePercent24Hr);
            if (asset.id === 'bitcoin') { pairInfo.BTCUSDT.price = price; pairInfo.BTCUSDT.change = change24h; }
            else if (asset.id === 'ethereum') { pairInfo.ETHUSDT.price = price; pairInfo.ETHUSDT.change = change24h; }
          });
          lastPriceFetch = now;
          return;
        }
      } catch(e) { console.log('CoinCap failed:', e.message); }
      
      if (pairInfo.BTCUSDT.price === 0) pairInfo.BTCUSDT.price = 80000;
      if (pairInfo.ETHUSDT.price === 0) pairInfo.ETHUSDT.price = 3800;
      if (pairInfo.XAUUSD.price === 0) pairInfo.XAUUSD.price = 2650;
      if (pairInfo.EURUSD.price === 0) pairInfo.EURUSD.price = 1.0850;
      lastPriceFetch = now;
    }

    function handleRoute() {
      const hash = location.hash;
      if (hash === '#home' || hash === '' || !hash) renderHome();
      else if (hash.startsWith('#level-')) renderLevelCourses(hash.replace('#level-', ''));
      else if (hash.startsWith('#course-')) renderCourseLessons(hash.replace('#course-', ''));
      else if (hash.startsWith('#lesson-')) {
        const parts = hash.replace('#lesson-', '').split('-');
        renderLesson(parts[0], parseInt(parts[1]));
      }
      else if (hash === '#quiz') renderQuizQuestion();
      else if (hash === '#demo') renderTradePage();
      else if (hash === '#profile') renderProfile();
      else renderHome();
    }

      const lessonIcon = getLessonIcon(currentLesson.title);

    function setupSlider() {
      const sliderDot = document.getElementById('sliderDot'); const sliderFill = document.getElementById('sliderFill'); const sliderContainer = document.getElementById('sliderContainer');
      if (!sliderDot || !sliderFill || !sliderContainer) return;
      let isDragging = false;
      const startDrag = (e) => { isDragging = true; e.preventDefault(); e.stopPropagation(); };
      const drag = (e) => { if (!isDragging) return; e.preventDefault(); e.stopPropagation(); const rect = sliderContainer.getBoundingClientRect(); const clientX = e.touches ? e.touches[0].clientX : e.clientX; let x = ((clientX - rect.left) / rect.width) * 100; x = Math.max(0, Math.min(100, x)); sliderValue = x; sliderDot.style.left = x + '%'; sliderFill.style.width = x + '%'; const percentEl = document.getElementById('sliderPercent'); if (percentEl) percentEl.textContent = Math.round(x) + '%'; updateTradeInfo(); };
      const endDrag = () => { isDragging = false; };
      sliderDot.addEventListener('mousedown', startDrag); sliderDot.addEventListener('touchstart', startDrag, {passive: false});
      document.addEventListener('mousemove', drag); document.addEventListener('touchmove', drag, {passive: false});
      document.addEventListener('mouseup', endDrag); document.addEventListener('touchend', endDrag);
      sliderContainer.addEventListener('click', (e) => { const rect = sliderContainer.getBoundingClientRect(); let x = ((e.clientX - rect.left) / rect.width) * 100; x = Math.max(0, Math.min(100, x)); sliderValue = x; sliderDot.style.left = x + '%'; sliderFill.style.width = x + '%'; const percentEl = document.getElementById('sliderPercent'); if (percentEl) percentEl.textContent = Math.round(x) + '%'; updateTradeInfo(); });
    }

    function updateTradeInfo() {
      const amountInput = parseFloat(document.getElementById('tradeAmount')?.value) || 0;
      const leverage = parseInt(document.querySelector('.leverage-btn.active')?.textContent) || 3;
      if (sliderValue > 0 && amountInput === 0) { const calculatedAmount = (demoAccount.balance * sliderValue / 100); const amountEl = document.getElementById('tradeAmount'); if (amountEl) amountEl.value = calculatedAmount.toFixed(2); }
      const finalAmount = parseFloat(document.getElementById('tradeAmount')?.value) || 0;
      const margin = (finalAmount * sliderValue / 100) / leverage;
      const available = demoAccount.balance - margin;
      const marginEl = document.getElementById('marginValue'); const availableEl = document.getElementById('availableValue'); const maxEl = document.getElementById('maxValue'); const liqEl = document.getElementById('liqPrice');
      if (marginEl) marginEl.textContent = margin.toFixed(2) + ' USDT';
      if (availableEl) availableEl.textContent = available.toFixed(2) + ' USDT';
      if (maxEl) maxEl.textContent = (finalAmount * sliderValue / 100 / currentPrice).toFixed(6);
      if (liqEl) {
        if (demoAccount.positions.length === 0) liqEl.textContent = '--';
        else {
          const pos = demoAccount.positions[demoAccount.positions.length - 1];
          const liqPrice = pos.side === 'buy' ? (pos.entryPrice * (1 - 1/pos.leverage)).toFixed(pairInfo[currentPair].decimals) : (pos.entryPrice * (1 + 1/pos.leverage)).toFixed(pairInfo[currentPair].decimals);
          liqEl.textContent = liqPrice;
        }
      }
    }

    function submitOrder() {
      const amount = parseFloat(document.getElementById('tradeAmount')?.value) || 0;
      if (amount <= 0) { alert('Please enter a valid amount'); return; }
      const leverage = parseInt(document.querySelector('.leverage-btn.active')?.textContent) || 3;
      const tp = parseFloat(document.getElementById('tpInput')?.value) || null;
      const sl = parseFloat(document.getElementById('slInput')?.value) || null;
      const position = { id: Date.now(), pair: currentPair, side: tradeType, amount: (amount * sliderValue / 100) / currentPrice, entryPrice: currentPrice, leverage: leverage, tp: tp, sl: sl, pnl: 0, pnlPercent: 0, openTime: Date.now() };

      userProfile.totalTrades++;
      saveDemoAccount(); saveUserProfile();
      renderPositions(); updateTradeInfo();
      alert('Order submitted!');

    function switchTab(tab, event) { if (event) event.stopPropagation(); activeTab = tab; document.querySelectorAll('.position-tab').forEach(t => t.classList.remove('active')); if (event && event.target) event.target.classList.add('active'); renderPositions(); }

    function updatePositionsPnL() {
      let changed = false;
      demoAccount.positions.forEach(pos => {
        const priceChange = pos.side === 'buy' ? (currentPrice - pos.entryPrice) : (pos.entryPrice - currentPrice);
        const newPnl = priceChange * pos.amount;
        const newPnlPercent = (priceChange / pos.entryPrice) * pos.leverage * 100;
        if (Math.abs(newPnl - pos.pnl) > 0.001) {
          pos.pnl = newPnl;
          pos.pnlPercent = newPnlPercent;
          changed = true;
        }
      });
      demoAccount.equity = demoAccount.balance + demoAccount.positions.reduce((sum, p) => sum + p.pnl, 0);
      saveDemoAccount();
      if (changed && activeTab === 'positions') renderPositions();
    }

    function renderPositions() {
      const container = document.getElementById('positionsContent');
      if (!container) return;
      if (activeTab === 'positions') {
        const positions = demoAccount.positions.filter(p => p.pair === currentPair);
        if (positions.length === 0) { container.innerHTML = '<div class="empty-state">No open positions</div>'; return; }
        container.innerHTML = positions.map(pos => { 
          const pnlClass = pos.pnl >= 0 ? 'profit' : 'loss'; 
          const pnlSign = pos.pnl >= 0 ? '+' : ''; 
          const sideClass = pos.side === 'buy' ? 'buy' : 'sell';
          const sideText = pos.side === 'buy' ? 'Long' : 'Short';
          return `<div class="position-item"><div class="position-header"><span class="position-pair">${pos.pair}</span><span class="position-side ${sideClass}">${sideText}</span></div><div class="position-details"><div class="position-detail"><span class="position-detail-label">Amount</span><span class="position-detail-value">${pos.amount.toFixed(6)}</span></div><div class="position-detail"><span class="position-detail-label">Leverage</span><span class="position-detail-value">${pos.leverage}x</span></div><div class="position-detail"><span class="position-detail-label">Entry</span><span class="position-detail-value">${pos.entryPrice.toFixed(pairInfo[pos.pair]?.decimals || 2)}</span></div><div class="position-detail"><span class="position-detail-label">Margin</span><span class="position-detail-value">${(pos.amount * pos.entryPrice / pos.leverage).toFixed(2)} USDT</span></div></div><div class="position-pnl ${pnlClass}">${pnlSign}$${pos.pnl.toFixed(2)} (${pnlSign}${pos.pnlPercent.toFixed(2)}%)</div><button class="close-btn" onclick="closePosition(${pos.id})">Close Position</button></div>`; 
        }).join('');
      } else if (activeTab === 'pending') { container.innerHTML = '<div class="empty-state">No pending orders<br><small>Use Limit Order to create one</small></div>'; }
      else if (activeTab === 'history') { 
        const history = demoAccount.history.filter(h => h.pair === currentPair); 
        if (history.length === 0) { container.innerHTML = '<div class="empty-state">No order history</div>'; return; } 
        container.innerHTML = history.slice().reverse().map(h => { 
          const pnlClass = h.pnl >= 0 ? 'profit' : 'loss'; 
          const pnlSign = h.pnl >= 0 ? '+' : '';
          const sideClass = h.side === 'buy' ? 'buy' : 'sell';
          const sideText = h.side === 'buy' ? 'Long' : 'Short';
          return `<div class="position-item"><div class="position-header"><span class="position-pair">${h.pair}</span><span class="position-side ${sideClass}">${sideText}</span></div><div class="position-details"><div class="position-detail"><span class="position-detail-label">Amount</span><span class="position-detail-value">${h.amount.toFixed(6)}</span></div><div class="position-detail"><span class="position-detail-label">Entry</span><span class="position-detail-value">${h.entryPrice.toFixed(pairInfo[h.pair]?.decimals || 2)}</span></div><div class="position-detail"><span class="position-detail-label">Exit</span><span class="position-detail-value">${h.closePrice?.toFixed(pairInfo[h.pair]?.decimals || 2) || '--'}</span></div><div class="position-detail"><span class="position-detail-label">PnL</span><span class="position-detail-value ${pnlClass}">${pnlSign}$${h.pnl.toFixed(2)}</span></div></div></div>`; 
        }).join(''); 
      }
    }

    function closePosition(id) { 
      const posIndex = demoAccount.positions.findIndex(p => p.id === id); 
      if (posIndex === -1) return; 
      const pos = demoAccount.positions[posIndex]; 
      pos.closePrice = currentPrice;
      const priceChange = pos.side === 'buy' ? (currentPrice - pos.entryPrice) : (pos.entryPrice - currentPrice);
      pos.pnl = priceChange * pos.amount;
      pos.pnlPercent = (priceChange / pos.entryPrice) * pos.leverage * 100;
      demoAccount.balance += pos.pnl; 
      demoAccount.history.push(pos); 
      demoAccount.positions.splice(posIndex, 1); 
      if (pos.pnl > 0) userProfile.winRate = Math.round((userProfile.quizzesPassed / Math.max(1, userProfile.totalTrades)) * 100); 
      saveDemoAccount(); 
      saveUserProfile(); 
      renderPositions(); 
      updateTradeInfo(); 
    }

    function generateOrderBook() {
      const asks = [], bids = [];
      const info = pairInfo[currentPair];
      const decimals = info.decimals;
      const step = currentPair === 'BTCUSDT' ? 10 : currentPair === 'ETHUSDT' ? 1 : currentPair === 'XAUUSD' ? 0.5 : 0.0005;
      for (let i = 1; i <= 8; i++) {
        asks.push({ price: (currentPrice + i * step).toFixed(decimals), amount: (Math.random() * 10).toFixed(4) });
        bids.push({ price: (currentPrice - i * step).toFixed(decimals), amount: (Math.random() * 10).toFixed(4) });
      }
      return { asks: asks.reverse(), bids };
    }

    function renderOrderBook() {
      const { asks, bids } = generateOrderBook();
      const asksEl = document.getElementById('orderBookAsks');
      const bidsEl = document.getElementById('orderBookBids');
      if (asksEl) asksEl.innerHTML = asks.map(o => `<div class="order-row ask"><span class="col-amount">${o.amount}</span><span class="col-price ask">${o.price}</span></div>`).join('');
      if (bidsEl) bidsEl.innerHTML = bids.map(o => `<div class="order-row bid"><span class="col-amount">${o.amount}</span><span class="col-price bid">${o.price}</span></div>`).join('');
    }

    function updatePriceDisplay() {
      const info = pairInfo[currentPair];
      const priceEl = document.getElementById('currentPrice');
      const changeEl = document.getElementById('pairChange');
      if (priceEl) priceEl.textContent = currentPrice.toFixed(info.decimals);
      if (changeEl) {
        const changeClass = info.change >= 0 ? 'up' : 'down';
        const changeSign = info.change >= 0 ? '+' : '';
        changeEl.textContent = `${changeSign}${info.change.toFixed(2)}%`;
        changeEl.className = `pair-change ${changeClass}`;
      }
    }

    function setTradeType(type) { tradeType = type; const buyTab = document.getElementById('buyTab'); const sellTab = document.getElementById('sellTab'); const submitBtn = document.getElementById('submitBtn'); if (buyTab) buyTab.className = 'trade-tab ' + (type === 'buy' ? 'buy' : ''); if (sellTab) sellTab.className = 'trade-tab ' + (type === 'sell' ? 'sell' : ''); if (submitBtn) { submitBtn.className = 'submit-btn ' + type; submitBtn.textContent = type === 'buy' ? 'Buy/Long' : 'Sell/Short'; } updateTradeInfo(); }
    function setLeverage(lev, btn) { document.querySelectorAll('.leverage-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); updateTradeInfo(); }

    function loadDemoAccount() { const saved = localStorage.getItem('demoAccount'); if (saved) { try { demoAccount = JSON.parse(saved); } catch (e) {} } }
    function saveDemoAccount() { localStorage.setItem('demoAccount', JSON.stringify(demoAccount)); }

    function renderQuizQuestion() { if (!currentLesson || !currentLesson.quiz || currentLesson.quiz.length === 0) return navigateTo('#home'); const q = currentLesson.quiz[quizState.currentQuestion]; const total = currentLesson.quiz.length; const num = quizState.currentQuestion + 1; let html = `<div class="quiz-container"><div style="text-align: center; margin-bottom: 16px; color: #7F8C8D; font-size: 13px;">سوال ${num} از ${total}</div><div class="quiz-question">${q.question}</div><div id="options-container">${q.options.map((opt, i) => `<div class="quiz-option" onclick="selectAnswer(${i})" id="opt-${i}">${opt}</div>`).join('')}</div><div class="quiz-explanation" id="explanation">💡 ${q.explanation}</div><div class="quiz-nav"><button class="btn-next" id="btn-next" onclick="nextQuestion()" disabled>${num === total ? 'مشاهده نتیجه' : 'سوال بعدی ←'}</button></div></div><button class="back-button" onclick="navigateTo('#course-${currentCourse.id}')">↶ خروج از آزمون</button>`; document.getElementById('app').innerHTML = html; quizState.answered = false; }
    function selectAnswer(index) { if (quizState.answered) return; quizState.answered = true; const q = currentLesson.quiz[quizState.currentQuestion]; if (index === q.correct) quizState.score++; document.querySelectorAll('.quiz-option').forEach((el, i) => { el.style.pointerEvents = 'none'; if (i === q.correct) el.classList.add('correct'); if (i === index && i !== q.correct) el.classList.add('incorrect'); }); document.getElementById('explanation').classList.add('show'); document.getElementById('btn-next').disabled = false; }
    function nextQuestion() { quizState.currentQuestion++; if (quizState.currentQuestion >= currentLesson.quiz.length) showQuizResult(); else renderQuizQuestion(); }
    function showQuizResult() { const total = currentLesson.quiz.length; const score = quizState.score; const pct = Math.round((score / total) * 100); let msg = pct === 100 ? '🎉 عالی!' : pct >= 70 ? '✅ آفرین!' : pct >= 50 ? '👍 خوب بود' : '📚 دوباره مرور کنید'; if (pct >= 70) { userProfile.quizzesPassed++; userProfile.lessonsCompleted++; saveUserProfile(); } document.getElementById('app').innerHTML = `<div class="quiz-container"><div class="quiz-result"><div class="quiz-score">${score} از ${total}</div><div class="quiz-message">${msg}</div><button class="quiz-button" onclick="navigateTo('#course-${currentCourse.id}')" style="max-width: 280px;">بازگشت به دوره</button></div></div><button class="back-button" onclick="navigateTo('#course-${currentCourse.id}')">↶ بازگشت</button>`; }

    function navigateTo(hash) { history.pushState({ hash }, '', hash); handleRoute(); }
    window.addEventListener('popstate', () => handleRoute());
    
    initApp();
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('service-worker.js?v=99').catch(console.error); }
  </script>
</body>
</html>
